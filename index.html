<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTP — Road to Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,700;1,900&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#06060a; --s1:#0c0c10; --s2:#121217; --s3:#18181f; --s4:#1f1f28;
  --b1:#252530; --b2:#32323f; --b3:#484858;
  --ac:#ff6a00; --ac2:#ffb347; --ac-glow:rgba(255,106,0,.32);
  --gold:#c9872a; --green:#22d17a;
  --t1:#f5f5f7; --t2:#c8c4be; --t3:#777080;
  --r:8px; --fh:'Barlow Condensed',sans-serif; --fb:'Noto Sans KR',sans-serif; --fm:'JetBrains Mono',monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--t1);font-family:var(--fb);min-height:100vh;overflow-x:hidden;}
button,input,select,textarea{font-family:inherit;}
::selection{background:var(--ac);color:#000;}

/* COVER */
#cover{position:fixed;inset:0;z-index:1000;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#cover::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");background-size:180px;pointer-events:none;}
.cover-center{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;margin-top:5vh;}
.cover-tiger{width:clamp(260px,36vw,520px);height:auto;display:block;filter:brightness(1.0) contrast(1.0);mix-blend-mode:screen;margin-bottom:-14px;animation:tigerIn .75s .1s cubic-bezier(.22,1,.36,1) both;pointer-events:none;}
@keyframes tigerIn{from{opacity:0;transform:translateY(-20px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.cover-rtp{font-family:var(--fh);font-size:clamp(100px,19vw,250px);font-weight:900;font-style:italic;line-height:.88;letter-spacing:-.01em;color:#fff;text-align:center;animation:fadeUp .55s .28s ease both;position:relative;z-index:2;pointer-events:none;}
.cover-sub{font-family:var(--fh);font-size:clamp(16px,2.6vw,32px);font-weight:700;font-style:italic;letter-spacing:.22em;text-transform:uppercase;color:#888;margin-top:10px;animation:fadeUp .5s .36s ease both;}
.cover-sub em{color:var(--ac2);font-style:normal;}
.cover-heartbeat{margin:22px 0 28px;width:clamp(260px,38vw,520px);animation:fadeUp .5s .44s ease both;}
.heartbeat-svg{width:100%;height:48px;overflow:visible;}
.hb-line{fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:520;stroke-dashoffset:520;}
.btn-enter{position:relative;background:none;border:none;cursor:pointer;padding:0;outline:none;animation:fadeUp .5s .58s ease both,heartbeat 1.6s 1.2s ease-in-out infinite;}
@keyframes heartbeat{0%{transform:scale(1);}10%{transform:scale(1.06);}20%{transform:scale(1);}30%{transform:scale(1.04);}40%{transform:scale(1);}100%{transform:scale(1);}}
.btn-enter::before,.btn-enter::after{content:'';position:absolute;inset:-4px;border-radius:14px;border:2px solid rgba(255,106,0,.55);animation:ripplePulse 1.6s 1.2s ease-out infinite;pointer-events:none;}
.btn-enter::after{border-color:rgba(255,179,71,.35);animation-delay:1.48s;}
@keyframes ripplePulse{0%{inset:-2px;opacity:.8;border-color:rgba(255,106,0,.6);}10%{inset:-10px;opacity:.5;}25%{inset:-22px;opacity:0;}30%{inset:-2px;opacity:.5;border-color:rgba(255,179,71,.4);}40%{inset:-12px;opacity:.3;}55%{inset:-24px;opacity:0;}100%{inset:-24px;opacity:0;}}
.btn-enter-inner{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;padding:17px 58px;border-radius:10px;background:linear-gradient(135deg,#ff7a1a 0%,#ff5500 50%,#e84d00 100%);border:none;overflow:hidden;transition:all .2s;box-shadow:0 0 0 1px rgba(255,130,0,.4),0 6px 28px rgba(255,90,0,.45),inset 0 1px 0 rgba(255,220,100,.25);}
.btn-enter-inner::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);animation:btnStreakLoop 2.4s 1.5s ease-in-out infinite;}
@keyframes btnStreakLoop{0%{left:-60%;opacity:0;}5%{opacity:1;}40%{left:130%;opacity:0;}100%{left:130%;opacity:0;}}
.btn-enter:hover .btn-enter-inner{background:linear-gradient(135deg,#ff8c2a 0%,#ff6310 50%,#f05500 100%);transform:translateY(-2px);}
.btn-enter:active .btn-enter-inner{transform:translateY(1px) scale(.98);}
.btn-enter-label{font-family:var(--fh);font-size:20px;font-weight:900;font-style:italic;letter-spacing:.18em;text-transform:uppercase;color:#000;position:relative;z-index:1;}
.btn-enter-arrow{font-family:var(--fm);font-size:15px;color:rgba(0,0,0,.65);position:relative;z-index:1;transition:transform .25s;}
.btn-enter:hover .btn-enter-arrow{transform:translateX(5px);}
.cover-bottom-line{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--ac),var(--ac2),var(--ac),transparent);background-size:200%;animation:shimmer 3s linear infinite;}
@keyframes shimmer{to{background-position:-200% 0;}}
#cover.exit{animation:coverOut .42s ease forwards;}
@keyframes coverOut{to{opacity:0;transform:scale(1.03);pointer-events:none;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

/* APP */
#app{display:none;}
.app-header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--s1);border-bottom:1px solid var(--b1);position:sticky;top:0;z-index:200;}
.header-logo{display:flex;align-items:center;gap:12px;}
.header-stripe{display:flex;flex-direction:column;gap:3px;}
.header-stripe span{display:block;height:2px;border-radius:1px;background:var(--ac);}
.header-stripe span:nth-child(1){width:18px;}
.header-stripe span:nth-child(2){width:12px;opacity:.6;}
.header-stripe span:nth-child(3){width:16px;opacity:.35;}
.header-rtp{font-family:var(--fh);font-size:22px;font-weight:900;font-style:italic;letter-spacing:.08em;color:var(--ac);}
.header-sep{color:var(--b3);font-size:16px;}
.header-sub{font-family:var(--fh);font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--t2);text-transform:uppercase;}
.btn-home{display:flex;align-items:center;background:transparent;border:none;color:var(--t2);cursor:pointer;padding:6px 8px;transition:all .2s;}
.btn-home:hover{color:var(--ac);}

.tab-bar{display:flex;background:var(--s1);border-bottom:2px solid var(--b1);position:sticky;top:54px;z-index:190;}
.tab-btn{padding:13px 24px;font-family:var(--fh);font-size:14px;font-weight:700;font-style:italic;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;transition:all .18s;}
.tab-btn:hover{color:var(--t1);}
.tab-btn.on{color:var(--ac);border-bottom-color:var(--ac);}

.view{display:none;} .view.on{display:block;}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px;}

/* SHARED */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);}
.card-head{padding:13px 20px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;background:var(--s2);}
.card-body{padding:20px;}
.hot-card{border-top:3px solid var(--ac);}
.sec-label{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--t2);margin-bottom:5px;}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;border:1px solid;font-size:13px;font-weight:600;cursor:pointer;transition:all .16s;background:none;letter-spacing:.04em;}
.btn-primary{background:var(--ac);border-color:var(--ac);color:#000;font-family:var(--fh);font-size:15px;letter-spacing:.1em;text-transform:uppercase;font-style:italic;border-radius:6px;}
.btn-primary:hover{background:var(--ac2);border-color:var(--ac2);}
.btn-ghost{border-color:var(--b2);color:var(--t1);}
.btn-ghost:hover{border-color:var(--t1);color:#fff;}
.btn-danger{border-color:transparent;color:var(--t2);}
.btn-danger:hover{color:var(--ac);}
.btn-sm{padding:5px 11px;font-size:12px;}
.btn-gold{border-color:var(--gold);color:var(--gold);font-family:var(--fh);font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-style:italic;}
.btn-gold:hover{background:rgba(201,135,42,.12);}
.btn-gold.filled{background:var(--gold);color:#000;}

.inp{width:100%;background:var(--s3);border:1px solid var(--b1);border-radius:4px;color:var(--t1);font-size:13px;padding:9px 12px;outline:none;transition:border-color .16s;}
.inp:focus{border-color:var(--ac);}
.inp::placeholder{color:var(--t2);}
.inp-mono{font-family:var(--fm);font-size:12px;}
.inp-sm{padding:6px 9px;font-size:12px;}
select.inp{cursor:pointer;}

#toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--s3);border:1px solid var(--b2);border-left:3px solid var(--ac);color:var(--t1);font-size:12px;font-family:var(--fm);padding:11px 18px;border-radius:var(--r);pointer-events:none;opacity:0;transform:translateY(8px);transition:all .22s;}
#toast.show{opacity:1;transform:translateY(0);}

/* PROGRAM TAB */
.prog-layout{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start;}
.prog-sidebar-title{font-family:var(--fh);font-size:26px;font-weight:900;font-style:italic;color:var(--ac);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;}
.prog-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.prog-item{background:var(--s2);border:1px solid var(--b1);border-left:3px solid transparent;border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:all .16s;position:relative;}
.prog-item:hover{border-left-color:var(--b2);}
.prog-item.active{border-left-color:var(--ac);background:rgba(255,106,0,.05);}
.prog-item-name{font-family:var(--fh);font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t1);margin-bottom:2px;}
.prog-item.active .prog-item-name{color:var(--ac);}
.prog-item-meta{font-size:11px;color:var(--t2);font-family:var(--fm);}
.prog-item-actions{position:absolute;top:10px;right:10px;display:flex;gap:4px;opacity:0;transition:opacity .15s;}
.prog-item:hover .prog-item-actions{opacity:1;}
.prog-date-badge{display:inline-block;font-family:var(--fm);font-size:10px;color:var(--ac2);letter-spacing:.06em;background:rgba(255,179,71,.08);border:1px solid rgba(255,179,71,.2);border-radius:3px;padding:1px 7px;margin-bottom:4px;}
.prog-active-badge{display:inline-block;font-family:var(--fm);font-size:9px;color:var(--green);letter-spacing:.1em;text-transform:uppercase;background:rgba(34,209,122,.08);border:1px solid rgba(34,209,122,.2);border-radius:3px;padding:1px 7px;margin-left:5px;}
.btn-new-prog{width:100%;background:transparent;border:1px dashed var(--b2);color:var(--t2);padding:12px;border-radius:var(--r);cursor:pointer;font-size:13px;font-family:var(--fh);font-weight:700;font-style:italic;letter-spacing:.1em;text-transform:uppercase;transition:all .16s;}
.btn-new-prog:hover{border-color:var(--ac);color:var(--ac);}
.prog-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:420px;gap:14px;color:var(--t2);border:1px dashed var(--b2);border-radius:var(--r);}
.prog-empty-icon{font-size:48px;opacity:.3;}
.day-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px;}
.day-tab{padding:6px 16px;border-radius:3px;border:1px solid var(--b1);background:transparent;color:var(--t2);font-family:var(--fh);font-size:13px;font-weight:700;font-style:italic;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .16s;}
.day-tab:hover{border-color:var(--b2);color:var(--t1);}
.day-tab.on{border-color:var(--ac);color:var(--ac);background:rgba(255,106,0,.08);}
.day-tab[draggable="true"]:hover{box-shadow:0 2px 8px rgba(0,0,0,.3);}
.day-tab.drag-over{outline:2px solid var(--ac);outline-offset:1px;}

/* 섹션 구분 */
.ex-section-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--s3);border-bottom:1px solid var(--b1);}
.ex-section-label{font-family:var(--fh);font-size:13px;font-weight:700;font-style:italic;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);}
.ex-section-label.warmup{color:#7ec8e3;}
.ex-section-label.main{color:var(--ac2);}

/* 대체 운동 */
.alt-ex-row{display:flex;align-items:center;gap:6px;padding:4px 12px 8px;background:rgba(255,106,0,.03);border-bottom:1px solid var(--b1);}
.alt-ex-input{flex:1;background:transparent;border:none;border-bottom:1px dashed var(--b2);color:var(--t2);font-size:12px;font-family:var(--fb);outline:none;padding:2px 4px;}
.alt-ex-input:focus{border-bottom-color:var(--ac2);color:var(--t1);}
.alt-ex-label{font-family:var(--fm);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);white-space:nowrap;}

/* 기록탭 대체 버튼 */
.btn-alt{padding:3px 8px;border-radius:4px;border:1px solid var(--b2);background:transparent;color:var(--t3);font-size:11px;font-family:var(--fm);cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-alt:hover{border-color:var(--ac2);color:var(--ac2);}
.btn-alt.active{border-color:var(--ac2);color:var(--ac2);background:rgba(255,179,71,.08);}

/* 휴식 분초 입력 */
.rest-minisec{display:flex;align-items:center;gap:2px;flex-wrap:nowrap;font-family:var(--fm);font-size:12px;}
.rest-minisec input{width:32px;min-width:28px;text-align:center;background:transparent;border:none;border-bottom:1px solid var(--b2);color:var(--t1);font-family:var(--fm);font-size:12px;outline:none;padding:2px 2px;}
.rest-minisec input:focus{border-bottom-color:var(--ac);}
.rest-minisec span{color:var(--t3);font-size:9px;flex-shrink:0;}
.day-tab.rest-tab{border-color:var(--b2);color:var(--t3);}
.day-tab.rest-tab:hover{border-color:var(--b3);color:var(--t2);}
.day-tab.rest-tab.on{border-color:var(--b3);color:var(--t2);background:rgba(50,50,63,.3);}
.rest-day-card{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--t3);font-family:var(--fh);font-size:18px;font-weight:700;font-style:italic;letter-spacing:.1em;}
.rest-day-card .rest-icon{font-size:36px;display:block;margin-bottom:10px;}
.rest-day-card .rest-desc{font-family:var(--fb);font-size:12px;font-style:normal;font-weight:400;color:var(--t3);margin-top:6px;letter-spacing:0;}
.field-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.field-chip{display:flex;align-items:center;gap:5px;background:var(--s3);border:1px solid var(--b2);border-radius:3px;padding:4px 10px;font-size:12px;font-family:var(--fm);color:var(--t1);}
.field-chip .chip-rm{background:none;border:none;color:var(--t2);cursor:pointer;font-size:13px;line-height:1;padding:0 2px;transition:color .14s;}
.field-chip .chip-rm:hover{color:var(--ac);}
.field-chip-add{background:transparent;border:1px dashed var(--b2);color:var(--t2);border-radius:3px;padding:4px 12px;font-size:12px;font-family:var(--fm);cursor:pointer;transition:all .16s;}
.field-chip-add:hover{border-color:var(--ac2);color:var(--ac2);}
.field-add-row{display:flex;gap:8px;align-items:center;background:var(--s3);border:1px solid var(--b1);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;}
.ex-table-head{display:grid;gap:8px;padding:7px 12px;font-family:var(--fm);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);border-bottom:1px solid var(--b1);}
.ex-row{display:grid;gap:8px;padding:9px 12px;border-bottom:1px solid rgba(37,37,48,.7);align-items:center;transition:background .14s;}
.ex-row:hover{background:rgba(255,106,0,.025);}
.ex-drag-handle{display:flex;align-items:center;justify-content:center;cursor:grab;color:var(--t3);font-size:16px;letter-spacing:-1px;user-select:none;touch-action:none;transition:color .15s;}
.ex-drag-handle:hover{color:var(--ac);}
.ex-row.ex-drag-over{outline:2px solid var(--ac);outline-offset:-1px;background:rgba(255,106,0,.06);}
.ex-sec-toggle{border-color:transparent!important;background:transparent!important;opacity:.5;transition:opacity .15s;}
.ex-sec-toggle:hover{opacity:1;}
.ex-row input{background:transparent;border:none;outline:none;color:var(--t1);font-size:13px;width:100%;}
.ex-row input::placeholder{color:var(--t2);}
.ex-row input:focus{color:var(--ac);}

/* LOG TAB */
.week-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.week-nav{display:flex;align-items:center;gap:12px;}
.week-nav-btn{width:36px;height:36px;border-radius:4px;border:1px solid var(--b2);background:var(--s2);color:var(--t1);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .16s;}
.week-nav-btn:hover{border-color:var(--ac);color:var(--ac);}
.week-title{font-family:var(--fh);font-size:28px;font-weight:900;font-style:italic;letter-spacing:.04em;text-transform:uppercase;}
.week-title em{color:var(--ac);font-style:normal;}
.week-prog-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--s2);border:1px solid var(--b1);border-left:3px solid var(--ac);border-radius:var(--r);padding:12px 18px;margin-bottom:20px;}
.week-prog-label{font-family:var(--fm);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--t2);flex-shrink:0;}
.prog-chip{padding:5px 14px;border-radius:3px;border:1px solid var(--b2);background:transparent;color:var(--t2);font-family:var(--fh);font-size:13px;font-weight:700;font-style:italic;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .16s;}
.prog-chip:hover{border-color:var(--b3);color:var(--t1);}
.prog-chip.on{border-color:var(--ac);color:var(--ac);background:rgba(255,106,0,.08);}
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.stat{background:var(--s2);border:1px solid var(--b1);border-top:3px solid var(--b1);border-radius:var(--r);padding:14px 18px;transition:border-top-color .4s;}
.stat.loaded{border-top-color:var(--ac);}
.stat-label{font-family:var(--fm);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--t2);margin-bottom:6px;}
.stat-val{font-family:var(--fh);font-size:32px;font-weight:900;color:var(--t1);line-height:1;}
.stat-val em{color:var(--ac);font-style:normal;}
.stat-unit{font-size:14px;color:var(--t2);margin-left:2px;}
.prog-bar-wrap{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:14px 20px;margin-bottom:20px;}
.prog-editor-head{padding:14px 20px;border-bottom:1px solid var(--b1);background:var(--s2);display:flex;flex-direction:column;gap:10px;}
.prog-name-inp{font-size:15px!important;font-weight:700;font-family:var(--fh);letter-spacing:.06em;text-transform:uppercase;font-style:italic;}
.prog-date-row{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;}
.prog-date-field{display:flex;flex-direction:column;gap:3px;}
.prog-date-field .inp{width:130px;}
.prog-date-sep{color:var(--t3);padding-bottom:9px;}
.prog-save-btn{flex-shrink:0;align-self:flex-end;}
.prog-save-bottom{margin-top:16px;text-align:center;}

.prog-bar-head{display:flex;justify-content:space-between;margin-bottom:10px;}
.prog-bar-label{font-family:var(--fm);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--t2);}
.prog-bar-pct{font-family:var(--fm);font-size:12px;color:var(--t1);}
.prog-bar-track{background:var(--s4);border-radius:2px;height:5px;overflow:hidden;}
.prog-bar-fill{height:100%;background:linear-gradient(90deg,#7a2e00,var(--ac),var(--ac2));border-radius:2px;transition:width .5s ease;}

/* 7-day grid */
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:20px;}
.day-card{background:var(--s2);border:1px solid var(--b1);border-top:3px solid var(--b1);border-radius:var(--r);cursor:pointer;transition:all .18s;overflow:hidden;}
.day-card:hover{border-top-color:var(--ac2);transform:translateY(-2px);}
.day-card.open{border-top-color:var(--ac);border-color:rgba(255,106,0,.35);transform:translateY(-2px);}
.day-card.done{border-top-color:var(--green);}
.day-card.is-weekend{opacity:.45;cursor:default;}
.day-card.is-weekend:hover{transform:none;border-top-color:var(--b1);}
.day-card.is-today{box-shadow:0 0 0 1px rgba(255,106,0,.4);}
.day-card-head{padding:9px 11px;border-bottom:1px solid var(--b1);display:flex;justify-content:space-between;align-items:flex-start;}
.day-card-num{font-family:var(--fh);font-size:22px;font-weight:900;font-style:italic;line-height:1;color:var(--t3);transition:color .18s;}
.day-card.open .day-card-num,.day-card.is-today .day-card-num{color:var(--ac);}
.day-card.done .day-card-num{color:var(--green);}
.day-card-date{font-family:var(--fm);font-size:9px;color:var(--t2);letter-spacing:.08em;margin-top:1px;}
.day-dot{width:7px;height:7px;border-radius:50%;background:var(--b2);flex-shrink:0;margin-top:4px;transition:all .18s;}
.day-dot.has{background:var(--ac);box-shadow:0 0 6px var(--ac-glow);}
.day-dot.done{background:var(--green);box-shadow:0 0 6px rgba(34,209,122,.35);}
.day-card-body{padding:9px 11px;min-height:70px;}
.day-card-label{font-family:var(--fm);font-size:9px;color:var(--ac2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;}
.day-preview{font-size:11px;color:var(--t2);line-height:1.5;}
.day-preview strong{color:var(--t1);font-size:11px;display:block;}
.day-done-tag{font-family:var(--fm);font-size:9px;color:var(--green);text-transform:uppercase;letter-spacing:.1em;margin-top:3px;}

.log-panel{background:var(--s1);border:1px solid var(--b1);border-top:3px solid var(--ac);border-radius:var(--r);display:none;animation:fadeSlide .2s ease;}
.log-panel.on{display:block;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.log-panel-head{background:var(--s2);padding:14px 22px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;}
.log-panel-title{font-family:var(--fh);font-size:20px;font-weight:900;font-style:italic;letter-spacing:.06em;text-transform:uppercase;}
.log-panel-title em{color:var(--ac);font-style:normal;margin-right:8px;}
.log-panel-body{padding:20px 22px;}
.log-ex-head{display:grid;gap:8px;padding:6px 12px;font-family:var(--fm);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--t2);border-bottom:1px solid var(--b1);margin-bottom:2px;}
.log-ex-row{display:grid;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(37,37,48,.5);align-items:center;}
.log-ex-name{font-size:13px;font-weight:500;color:var(--t1);}
.log-field-input{background:var(--s3);border:1px solid var(--b1);border-radius:4px;color:var(--t1);font-family:var(--fm);font-size:12px;text-align:center;padding:5px 6px;width:100%;outline:none;transition:border-color .15s;}
.log-field-input:focus{border-color:var(--ac);}
.log-field-input::placeholder{color:var(--t2);font-style:italic;}
.log-check{width:24px;height:24px;border-radius:4px;border:1px solid var(--b2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:all .15s;flex-shrink:0;}
.log-check.on{background:var(--green);border-color:var(--green);color:#000;}
.log-bottom{margin-top:18px;display:flex;gap:10px;align-items:center;}

/* TODAY TAB */
.today-wrap{max-width:720px;margin:0 auto;padding:28px 24px;}
.today-week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px;}
.twday{background:var(--s2);border:1px solid var(--b1);border-radius:6px;padding:8px 4px;text-align:center;}
.twday-name{font-family:var(--fm);font-size:9px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;}
.twday-date{font-size:12px;font-weight:600;color:var(--t2);font-family:var(--fm);}
.twday.is-today{border-color:var(--ac);background:rgba(255,106,0,.07);}
.twday.is-today .twday-date{color:var(--ac);}
.twday.is-done{border-color:rgba(34,209,122,.3);}
.twday.is-done .twday-date{color:var(--green);}
.twday.is-selected{border-color:var(--ac2);background:rgba(255,179,71,.08);}
.twday.is-selected .twday-date{color:var(--ac2);}
.twday.is-selected.is-today{border-color:var(--ac);background:rgba(255,106,0,.07);}
.twday.is-selected.is-today .twday-date{color:var(--ac);}
.today-hero{background:var(--s2);border:1px solid var(--b1);border-top:3px solid var(--ac);border-radius:var(--r);padding:24px 28px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
.today-date-label{font-family:var(--fm);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--t2);margin-bottom:6px;}
.today-day-title{font-family:var(--fh);font-size:42px;font-weight:900;font-style:italic;color:var(--t1);line-height:1;}
.today-day-title em{color:var(--ac);}
.today-day-sub{font-family:var(--fh);font-size:18px;font-weight:700;font-style:italic;color:var(--t2);margin-top:4px;}
.today-prog-name{font-family:var(--fm);font-size:11px;color:var(--t3);letter-spacing:.1em;margin-top:8px;}
.today-badge{font-family:var(--fh);font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:10px 22px;border-radius:8px;text-align:center;flex-shrink:0;}
.today-badge.done{background:rgba(34,209,122,.1);border:1px solid rgba(34,209,122,.3);color:var(--green);}
.today-badge.todo{background:rgba(255,106,0,.08);border:1px solid rgba(255,106,0,.25);color:var(--ac);}
.today-badge.rest{background:rgba(50,50,63,.4);border:1px solid var(--b2);color:var(--t3);}
.today-no-prog{text-align:center;padding:60px 20px;color:var(--t2);font-size:14px;line-height:2;}
.today-no-prog .big{font-family:var(--fh);font-size:28px;font-weight:700;font-style:italic;color:var(--t3);display:block;margin-bottom:8px;}
.today-panel{background:var(--s1);border:1px solid var(--b1);border-top:3px solid var(--ac);border-radius:var(--r);}
.today-panel-head{background:var(--s2);padding:14px 22px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;}
.today-panel-title{font-family:var(--fh);font-size:20px;font-weight:900;font-style:italic;letter-spacing:.06em;text-transform:uppercase;}
.today-panel-title em{color:var(--ac);font-style:normal;margin-right:8px;}
.today-panel-body{padding:20px 22px;}

@media(max-width:900px){.prog-layout{grid-template-columns:1fr;}.day-grid{grid-template-columns:repeat(4,1fr);}.stats-strip{grid-template-columns:repeat(2,1fr);}}
@media(max-width:540px){.day-grid{grid-template-columns:repeat(3,1fr);}}

/* ── 모바일 반응형 ── */
@media(max-width:600px){
  /* 전체 여백 축소 */
  .wrap{padding:16px 12px;}
  .today-wrap{padding:16px 12px;}
  .card-body{padding:14px 12px;}
  .card-head{padding:10px 14px;}

  /* 헤더 */
  .app-header{padding:0 14px;}
  .header-sub{display:none;}
  .header-sep{display:none;}

  /* 탭바 */
  .tab-btn{padding:10px 12px;font-size:12px;letter-spacing:.06em;}

  /* 프로그램 에디터 - 운동 행 모바일 2열 레이아웃 */
  .ex-table-head{display:none;}
  .ex-row{display:grid!important;grid-template-columns:24px 1fr auto auto!important;grid-template-rows:auto auto!important;gap:4px 6px!important;padding:10px 10px;border-bottom:1px solid var(--b1);align-items:center;}
  .ex-row .ex-drag-handle{grid-column:1;grid-row:1/3;align-self:center;}
  .ex-row>input:nth-child(2){grid-column:2/5;grid-row:1;font-size:13px!important;font-weight:600;}
  .ex-row .rest-minisec{grid-column:2;grid-row:2;}
  .ex-row>input[type=number]:not(:nth-child(2)){grid-column:2;grid-row:2;}
  .ex-row .ex-sec-toggle{grid-column:3;grid-row:2;justify-self:end;}
  .ex-row>.btn-danger:last-child{grid-column:4;grid-row:2;justify-self:end;}
  .ex-row>span{grid-column:3;grid-row:2;}

  /* DAY 탭 관리 영역 */
  .day-tabs{gap:4px;}
  .day-tab{padding:5px 10px;font-size:12px;}

  /* 주간 기록 - 7일 그리드 */
  .day-grid{grid-template-columns:repeat(7,1fr);gap:4px;}
  .day-card-head{padding:6px 6px;}
  .day-card-body{padding:6px 6px;min-height:48px;}
  .day-card-num{font-size:16px;}
  .day-card-date{font-size:8px;}
  .day-card-label{font-size:8px;}
  .day-preview{font-size:9px;}
  .day-preview strong{font-size:9px;}

  /* 통계 스트립 */
  .stats-strip{grid-template-columns:repeat(2,1fr);gap:6px;}
  .stat{padding:10px 12px;}
  .stat-val{font-size:24px;}

  /* 주간 헤더 */
  .week-title{font-size:18px;}
  .week-nav-btn{width:30px;height:30px;font-size:14px;}
  .week-prog-row{padding:8px 12px;gap:6px;}
  .prog-chip{padding:4px 10px;font-size:12px;}

  /* 로그 패널 */
  .log-panel-head{padding:10px 14px;}
  .log-panel-body{padding:14px;}
  .log-panel-title{font-size:16px;}
  .log-sets-head{grid-template-columns:30px 1fr 1fr!important;}
  .log-set-row{grid-template-columns:30px 1fr 1fr!important;}

  /* 오늘의 기록 */
  .today-hero{padding:16px 16px;}
  .today-day-title{font-size:30px;}
  .today-panel-head{padding:10px 14px;}
  .today-panel-body{padding:14px;}

  /* 주간 스트립 */
  .today-week-strip{gap:3px;}
  .twday{padding:6px 2px;}
  .twday-name{font-size:8px;}
  .twday-date{font-size:10px;}

  /* 프로그램 에디터 헤더 모바일 */
  .prog-editor-head{padding:12px 14px;}
  .prog-name-inp{font-size:16px!important;}
  .prog-date-row{gap:6px;}
  .prog-date-field .inp{width:100%;min-width:0;}
  .prog-date-sep{display:none;}
  .prog-save-btn{width:100%;}
  .prog-date-row{flex-direction:column;align-items:stretch;}

  /* 프로그램 리스트 사이드바 */
  .prog-sidebar-title{font-size:20px;}
  .prog-item{padding:10px 12px;}
  .prog-item-name{font-size:13px;}

  /* 프로그램 편집기 헤더 */
  .prog-bar-wrap{padding:10px 14px;}
  .prog-bar-pct{font-size:11px;}

  /* iOS 자동 확대 방지: 모든 입력 요소 font-size 16px 강제 */
  input, select, textarea{font-size:16px!important;}
  .log-field-input{font-size:16px!important;}
  .inp{font-size:16px!important;}
  .inp-sm{font-size:16px!important;}
}

/* ── COVER CHOICE ── */
#cover-phase2 { animation: fadeUp .35s ease both; display:flex; flex-direction:column; align-items:center; gap:20px; }
.cover-choice-label {
  font-family: var(--fm); font-size: 11px; letter-spacing: .28em;
  text-transform: uppercase; color: var(--t3);
  animation: fadeUp .3s .05s ease both;
}
.cover-choice-row {
  display: flex; align-items: center; gap: 24px;
  animation: fadeUp .35s .1s ease both;
}
.cover-choice-vs {
  font-family: var(--fh); font-size: 20px; font-weight: 900;
  font-style: italic; color: var(--t3); letter-spacing: .1em;
}
.btn-choice {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--b2);
  border-radius: 14px;
  padding: 22px 32px;
  cursor: pointer;
  transition: all .22s;
  position: relative; overflow: hidden;
}
.btn-choice::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,106,0,.08), transparent);
  opacity: 0; transition: opacity .22s;
}
.btn-choice:hover { border-color: var(--ac); transform: translateY(-4px); box-shadow: 0 12px 36px rgba(255,106,0,.2); }
.btn-choice:hover::before { opacity: 1; }
.btn-choice-pig::before { background: linear-gradient(135deg, rgba(255,105,180,.1), transparent); }
.btn-choice-pig:hover { border-color: #ff69b4; box-shadow: 0 12px 36px rgba(255,105,180,.2); }
.btn-choice-icon { font-size: 52px; line-height: 1; filter: drop-shadow(0 4px 12px rgba(0,0,0,.4)); }
.btn-choice-name {
  font-family: var(--fh); font-size: 20px; font-weight: 900;
  font-style: italic; letter-spacing: .12em;
  color: var(--t1);
}
.btn-choice:hover .btn-choice-name { color: var(--ac); }
.btn-choice-pig:hover .btn-choice-name { color: #ff69b4; }

/* ── USER BADGE in header ── */
.user-badge {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--fh); font-size: 16px; font-weight: 700;
  font-style: italic; letter-spacing: .08em;
  color: var(--t2);
}
.user-badge-icon { font-size: 20px; }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB83bde3wjL-inDLpLJC1YRcBklqZPJS7M",
  authDomain: "roadtopro-54ed0.firebaseapp.com",
  projectId: "roadtopro-54ed0",
  storageBucket: "roadtopro-54ed0.firebasestorage.app",
  messagingSenderId: "643745627506",
  appId: "1:643745627506:web:a3339fb20382966862b1eb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── Firestore 헬퍼 ──
// 고정 유저 ID (로그인 없이 단일 사용자)
const USER_ID = 'default_user';

window._db = db;
window._fs = { doc, getDoc, setDoc, collection, getDocs, deleteDoc };
window._userId = USER_ID;

// Firestore 저장/로드 래퍼
window.fsSet = async function(path, data) {
  try {
    await setDoc(doc(db, path), data);
  } catch(e) { console.error('fsSet error:', e); }
};
window.fsGet = async function(path) {
  try {
    const snap = await getDoc(doc(db, path));
    return snap.exists() ? snap.data() : null;
  } catch(e) { console.error('fsGet error:', e); return null; }
};
window.fsGetAll = async function(colPath) {
  try {
    const snap = await getDocs(collection(db, colPath));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { console.error('fsGetAll error:', e); return []; }
};
window.fsDelete = async function(path) {
  try {
    await deleteDoc(doc(db, path));
  } catch(e) { console.error('fsDelete error:', e); }
};

// Firebase 준비 완료 신호
window._firebaseReady = true;
document.dispatchEvent(new Event('firebase-ready'));
</script>

    <button class="tab-btn" onclick="switchTab('log',this)">📝 주간 기록</button>

  <div class="view" id="view-log">

      <div class="week-nav">
        <button class="week-nav-btn" onclick="changeWeek(-1)">←</button>
        <div class="week-title" id="week-title"></div>
        <button class="week-nav-btn" onclick="changeWeek(1)">→</button>
      </div>

      <span class="week-prog-label">이번 주 프로그램</span>
      <div id="prog-chips" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;"></div>

    </div>
    <div class="stats-strip">
      <div class="stat" id="st0"><div class="stat-label">완료한 일</div><div class="stat-val">0<span class="stat-unit">일</span></div></div>
      <div class="stat" id="st1"><div class="stat-label">총 세트</div><div class="stat-val">0<span class="stat-unit">세트</span></div></div>
      <div class="stat" id="st2"><div class="stat-label">총 볼륨</div><div class="stat-val">0<span class="stat-unit">kg</span></div></div>
      <div class="stat" id="st3"><div class="stat-label">완료율</div><div class="stat-val">0<span class="stat-unit">%</span></div></div>
    </div>
    <div class="prog-bar-wrap">
      <div class="prog-bar-head">
        <span class="prog-bar-label">주간 진행률</span>
        <span class="prog-bar-pct" id="prog-bar-pct">0 / 5일</span>
      </div>
      <div class="prog-bar-track"><div class="prog-bar-fill" id="prog-bar-fill" style="width:0"></div></div>
    </div>
    <div class="day-grid" id="day-grid"></div>
    <div class="log-panel" id="log-panel">
      <div class="log-panel-head">
        <div class="log-panel-title"><em id="lp-title-day"></em><span id="lp-title-name"></span></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-sm btn-gold" id="btn-done" onclick="toggleDone()">완료 체크</button>
          <button class="btn btn-sm btn-ghost" onclick="closeLogPanel()">✕ 닫기</button>
        </div>

      <div class="log-panel-body" id="lp-body"></div>
    </div>

  <!-- TODAY -->
  <div class="view on" id="view-today">
  <div class="today-wrap">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:nowrap;">
      <div style="font-family:var(--fh);font-size:18px;font-weight:900;font-style:italic;letter-spacing:.06em;color:var(--t1);white-space:nowrap;flex-shrink:0;">⚡ 오늘의 기록</div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <span style="font-family:var(--fm);font-size:10px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;">날짜</span>
        <input type="date" id="today-date-selector" class="inp inp-sm inp-mono" style="width:138px;"
          onchange="onTodayDateChange(this.value)">
        <button class="btn btn-sm btn-ghost" onclick="todaySelectedDate=null;renderToday();" style="font-size:11px;">오늘</button>
      </div>
    </div>
    <div class="today-week-strip" id="today-week-strip"></div>
    <div id="today-hero-wrap"></div>
    <div id="today-log-wrap"></div>
  </div>

</div><!-- #app -->

<div id="toast"></div>

<script>
const DAYS_KO=['월','화','수','목','금','토','일'];
let programs=[], logs={};
let editingProgId=null, editingDayIdx=0, weekOffset=0, logOpenDay=null, weekProgId=null;
let todaySelectedDate=null;
let currentUser='tiger';

/* ── 유틸 ── */
function lsLoad(k){try{return JSON.parse(localStorage.getItem(k));}catch{return null;}}
function lsSave(k,v){localStorage.setItem(k,JSON.stringify(v));}
function uid(){return 'p'+Date.now()+Math.random().toString(36).slice(2,6);}
function toISO(d){return d.toISOString().slice(0,10);}
function fmt(d){return (d.getMonth()+1)+'/'+d.getDate();}
function fmtDate(s){if(!s)return '';const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'월 '+d.getDate()+'일';}
function toast(msg,col){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.borderLeftColor=col||'var(--ac)';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);
}
function showLoading(v){
  let el=document.getElementById('loading-bar');
  if(!el){el=document.createElement('div');el.id='loading-bar';
    el.style.cssText='position:fixed;top:0;left:0;right:0;height:3px;background:var(--ac);z-index:9999;transition:opacity .3s;';
    document.body.appendChild(el);}
  el.style.opacity=v?'1':'0';
}

/* ── 주간 헬퍼 ── */
function getWeekDates(off){
  if(off===undefined)off=weekOffset;
  const n=new Date(),day=n.getDay();
  const mon=new Date(n);
  mon.setDate(n.getDate()-((day+6)%7)+off*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function weekKey(off){if(off===undefined)off=weekOffset;return getWeekDates(off)[0].toISOString().slice(0,10);}
function getWeekLog(off){if(off===undefined)off=weekOffset;return logs[weekKey(off)]||{progId:null,days:{}};}
function setWeekLogLocal(wl,off){if(off===undefined)off=weekOffset;logs[weekKey(off)]=wl;}
function getActiveProg(off){
  if(off===undefined)off=0;
  const dates=getWeekDates(off);
  const wkMon=toISO(dates[0]),wkSun=toISO(dates[6]);
  return programs.find(p=>p.startDate&&p.endDate&&wkMon<=p.endDate&&wkSun>=p.startDate)||null;
}

/* ── Firebase 저장/로드 ── */
function userPath(){return 'users/'+window._userId;}
async function savePrograms(){
  showLoading(true);
  for(const p of programs){
    await window.fsSet(userPath()+'/programs/'+p.id, p);
  }
  lsSave('rtp_programs_'+currentUser, programs);
  showLoading(false);
}
async function saveWeekLog(off){
  if(off===undefined)off=weekOffset;
  const wk=weekKey(off);
  const wl=logs[wk]||{progId:null,days:{}};
  showLoading(true);
  await window.fsSet(userPath()+'/logs/'+wk, wl);
  lsSave('rtp_logs_'+currentUser, logs);
  showLoading(false);
}
async function deleteProgFromFirestore(id){
  await window.fsDelete(userPath()+'/programs/'+id);
}
async function loadAllData(){
  showLoading(true);
  try{
    const progs=await window.fsGetAll(userPath()+'/programs');
    programs=progs.length>0?progs:(lsLoad('rtp_programs_'+currentUser)||[]);
    lsSave('rtp_programs_'+currentUser,programs);
    const logDocs=await window.fsGetAll(userPath()+'/logs');
    logs={};
    logDocs.forEach(l=>{const id=l.id;delete l.id;logs[id]=l;});
    if(!logDocs.length)logs=lsLoad('rtp_logs_'+currentUser)||{};
    lsSave('rtp_logs_'+currentUser,logs);
  }catch(err){
    console.warn('Firebase 실패, localStorage 사용:', err);
    programs=lsLoad('rtp_programs_'+currentUser)||[];
    logs=lsLoad('rtp_logs_'+currentUser)||{};
  }
  showLoading(false);
}

/* ── 표지 ── */
window.showChoice=function(){
  document.getElementById('cover-phase1').style.display='none';
  document.getElementById('cover-phase2').style.display='flex';
};
window.enterAs=function(user){
  currentUser=user;
  window._userId=user;
  const badge=document.getElementById('user-badge');
  if(badge){
    badge.innerHTML=user==='tiger'
      ?'<span class="user-badge-icon">🐯</span> TIGER'
      :'<span class="user-badge-icon">🐷</span> PIG';
    badge.style.color=user==='tiger'?'var(--ac)':'#ff69b4';
  }
  const c=document.getElementById('cover');
  c.classList.add('exit');
  setTimeout(async ()=>{
    c.style.display='none';
    document.getElementById('app').style.display='block';
    programs=[];logs={};

    // 1) localStorage 캐시로 즉시 렌더
    programs=lsLoad('rtp_programs_'+currentUser)||[];
    logs=lsLoad('rtp_logs_'+currentUser)||{};
    renderProgList();
    renderToday();

    // 2) Firebase 준비될 때까지 기다린 후 최신 데이터로 갱신
    const firebaseLoad=async ()=>{
      await loadAllData();
      renderProgList();
      renderToday();
    };
    if(window._firebaseReady){
      firebaseLoad();
    }else{
      document.addEventListener('firebase-ready',firebaseLoad,{once:true});
    }
  },440);
};
window.goHome=function(){
  document.getElementById('app').style.display='none';
  const cover=document.getElementById('cover');
  cover.classList.remove('exit');
  cover.style.display='flex';
  document.getElementById('cover-phase1').style.display='block';
  document.getElementById('cover-phase2').style.display='none';
};

/* ── 탭 ── */
window.switchTab=function(name,el){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('view-'+name).classList.add('on');
  if(name==='log')renderLog();
  if(name==='today'){if(!todaySelectedDate)todaySelectedDate=toISO(new Date());renderToday();}
  if(name==='program')renderProgList();
};

/* ══════════════════════════════════
   프로그램 설계
   운동명 + 세트 수 + 휴식시간만
══════════════════════════════════ */
function renderProgList(){
  const el=document.getElementById('prog-list');
  el.innerHTML='';
  if(!programs.length){
    el.innerHTML='<div style="color:var(--t3);font-size:12px;padding:6px 0;font-family:var(--fm);">프로그램 없음</div>';
    return;
  }
  const sorted=[...programs].sort(function(a,b){
    if(!a.startDate&&!b.startDate)return 0;
    if(!a.startDate)return 1;if(!b.startDate)return -1;
    return b.startDate.localeCompare(a.startDate);
  });
  const today=toISO(new Date());
  sorted.forEach(function(p){
    const div=document.createElement('div');
    div.className='prog-item'+(editingProgId===p.id?' active':'');
    const isActive=p.startDate&&p.endDate&&today>=p.startDate&&today<=p.endDate;
    let dateHtml='<div style="font-size:10px;color:var(--t3);font-family:var(--fm);margin-bottom:3px;">날짜 미설정</div>';
    if(p.startDate&&p.endDate){
      dateHtml='<div class="prog-date-badge">'+fmtDate(p.startDate)+' — '+fmtDate(p.endDate)
        +(isActive?'<span class="prog-active-badge">진행중</span>':'')+'</div>';
    }
    div.innerHTML=dateHtml
      +'<div class="prog-item-name">'+p.name+'</div>'
      +'<div class="prog-item-meta">운동 '+p.days.filter(function(d){return d.type!=='rest'&&d.exercises.length;}).length+'일 · 휴식 '+p.days.filter(function(d){return d.type==='rest';}).length+'일 / 총 '+p.days.length+'일</div>';
    const delBtn=document.createElement('button');
    delBtn.className='btn btn-sm btn-danger';delBtn.innerHTML='✕';
    delBtn.addEventListener('click',function(e){e.stopPropagation();deleteProgram(p.id);});
    const actDiv=document.createElement('div');actDiv.className='prog-item-actions';actDiv.appendChild(delBtn);
    div.appendChild(actDiv);
    div.addEventListener('click',function(){openEditor(p.id);});
    el.appendChild(div);
  });
}

window.newProgram=function(){
  const p={id:uid(),name:'새 프로그램',startDate:'',endDate:'',
    days:Array.from({length:5},function(_,i){
      return {
        label:'Day '+(i+1),
        exercises:[]
      };
    })
  };
  programs.push(p);renderProgList();openEditor(p.id);
};
window.deleteProgram=async function(id){
  if(!confirm('삭제할까요?'))return;
  programs=programs.filter(function(p){return p.id!==id;});
  await deleteProgFromFirestore(id);
  lsSave('rtp_programs_'+currentUser,programs);
  if(editingProgId===id){editingProgId=null;renderEditorEmpty();}
  renderProgList();toast('🗑 삭제됨');
};
function renderEditorEmpty(){
  document.getElementById('prog-editor').innerHTML=
    '<div class="prog-empty"><div class="prog-empty-icon">🐯</div>'
    +'<div style="font-size:14px;font-family:var(--fh);letter-spacing:.06em;text-transform:uppercase;font-style:italic;">프로그램을 선택하거나 새로 만드세요</div>'
    +'<button class="btn btn-primary" onclick="newProgram()">+ 새 프로그램</button></div>';
}
function openEditor(id){editingProgId=id;editingDayIdx=0;renderProgList();renderEditor();}
function getProg(){return programs.find(function(p){return p.id===editingProgId;});}

/* 에디터 렌더: 운동명 + 세트 + 휴식시간 */
function renderEditor(){
  const p=getProg();if(!p){renderEditorEmpty();return;}
  const day=p.days[editingDayIdx];
  const isRestDay=(day&&day.type==='rest');

  // DAY 탭 하단에 추가/삭제 버튼 표시
  const canAddDay=(p.days.length<7);
  const canRemoveDay=(p.days.length>1);
  const dayMgmtHtml='<div style="display:flex;gap:6px;margin-bottom:18px;align-items:center;flex-wrap:wrap;">'
    +'<span class="sec-label" style="margin-bottom:0;flex-shrink:0;">루틴</span>'
    +'<div class="day-tabs" id="day-tabs-drag" style="margin-bottom:0;flex:1;display:flex;gap:5px;flex-wrap:wrap;"></div>'
    +(canAddDay?'<button class="btn btn-sm btn-ghost" onclick="addDay()" style="flex-shrink:0;white-space:nowrap;">+ DAY 추가</button>':'')
    +(canAddDay?'<button class="btn btn-sm btn-ghost" onclick="addRestDay()" style="flex-shrink:0;white-space:nowrap;border-color:var(--b3);color:var(--t3);">🌿 휴식 추가</button>':'')
    +(canRemoveDay?'<button class="btn btn-sm btn-danger" onclick="removeDay()" style="flex-shrink:0;white-space:nowrap;">삭제</button>':'')
    +'</div>';

  // 에디터 body: 휴식일이면 안내, 운동일이면 운동 목록
  let editorBody='';
  if(isRestDay){
    editorBody='<div class="rest-day-card"><span class="rest-icon">🌿</span>REST DAY'
      +'<div class="rest-desc">이 날은 휴식일입니다. 운동 기록이 표시되지 않습니다.</div></div>';
  }else if(day){
    // 섹션별로 운동 분리
    const warmups=(day.exercises||[]).map((ex,i)=>({ex,i})).filter(({ex})=>ex.section==='warmup');
    const mains=(day.exercises||[]).map((ex,i)=>({ex,i})).filter(({ex})=>ex.section!=='warmup');

    function renderExRow(ex,ei){
      const isCardio=(ex.exType==='cardio');
      const restSec=parseInt(ex.rest)||0;
      const restMin=Math.floor(restSec/60);
      const restSecRem=restSec%60;
      const isWarmup=(ex.section==='warmup');
      const secTitle=isWarmup?'본운동으로 이동':'선행운동으로 이동';
      const secIcon=isWarmup?'🔶':'🔵';
      return '<div class="ex-row" data-ei="'+ei+'" style="grid-template-columns:28px 1fr 72px minmax(110px,auto) 28px 28px">'
        +'<div class="ex-drag-handle" data-ei="'+ei+'" title="드래그하여 순서 변경">≡</div>'
        +'<input value="'+(ex.name||'')+'" placeholder="운동 이름" oninput="updateExName('+ei+',this.value)">'
        +(isCardio
          ?'<input value="'+(ex.duration||'')+'" placeholder="분" type="number" min="0" inputmode="numeric" oninput="updateEx('+ei+',\'duration\',this.value)" style="text-align:center;font-family:var(--fm);font-size:12px;">'
           +'<span style="display:flex;align-items:center;font-size:10px;color:var(--ac2);font-family:var(--fm);">유산소</span>'
          :'<input value="'+(ex.sets||'')+'" placeholder="3" type="number" min="1" inputmode="numeric" oninput="updateEx('+ei+',\'sets\',this.value)" style="text-align:center;font-family:var(--fm);font-size:12px;">'
           +'<div class="rest-minisec">'
             +'<input type="number" min="0" max="59" inputmode="numeric" value="'+restMin+'" placeholder="0" oninput="updateRestMinSec('+ei+',this.value,null)">'
             +'<span>분</span>'
             +'<input type="number" min="0" max="59" inputmode="numeric" value="'+restSecRem+'" placeholder="0" oninput="updateRestMinSec('+ei+',null,this.value)">'
             +'<span>초</span>'
             +'</div>'
        )
        +'<button class="btn btn-sm btn-danger ex-sec-toggle" onclick="toggleExSection('+ei+')" title="'+secTitle+'" style="padding:3px 5px;font-size:11px;">'+secIcon+'</button>'
        +'<button class="btn btn-sm btn-danger" onclick="removeEx('+ei+')" style="padding:3px 7px;">✕</button>'
        +'</div>'
        // 대체 운동 입력 (여러 개, 세트/휴식 포함)
        +(function(){
          const alts=Array.isArray(ex.alts)&&ex.alts.length?ex.alts:[];
          let altHtml='';
          alts.forEach(function(a,ai){
            const aObj=(typeof a==='object'&&a!==null)?a:{name:a||''};
            const aIsCardio=(aObj.exType==='cardio');
            const aRestSec=parseInt(aObj.rest)||0;
            const aRestMin=Math.floor(aRestSec/60);
            const aRestSecRem=aRestSec%60;
            altHtml+='<div style="background:rgba(255,179,71,.04);border-bottom:1px solid var(--b1);padding:8px 12px;">'
              // 대체 운동 이름 행
              +'<div style="display:grid;grid-template-columns:1fr 72px minmax(110px,auto) 32px;gap:8px;align-items:center;margin-bottom:6px;">'
              +'<div style="display:flex;align-items:center;gap:6px;">'
              +'<span style="font-family:var(--fm);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac2);white-space:nowrap;">대체'+(alts.length>1?' '+(ai+1):'')+'</span>'
              +'<input style="flex:1;background:transparent;border:none;border-bottom:1px solid var(--b2);color:var(--t1);font-size:13px;font-family:var(--fb);outline:none;padding:2px 4px;" value="'+(aObj.name||'')+'" placeholder="대체 운동 이름" oninput="updateAltField('+ei+','+ai+',\'name\',this.value)">'
              +'</div>'
              +(aIsCardio
                ?'<input value="'+(aObj.duration||'')+'" placeholder="분" type="number" min="0" inputmode="numeric" oninput="updateAltField('+ei+','+ai+',\'duration\',this.value)" style="text-align:center;font-family:var(--fm);font-size:12px;background:transparent;border:none;border-bottom:1px solid var(--b2);color:var(--t1);outline:none;">'
                 +'<span style="display:flex;align-items:center;font-size:10px;color:var(--ac2);font-family:var(--fm);">유산소</span>'
                :'<input value="'+(aObj.sets||'')+'" placeholder="3" type="number" min="1" inputmode="numeric" oninput="updateAltField('+ei+','+ai+',\'sets\',this.value)" style="text-align:center;font-family:var(--fm);font-size:12px;background:transparent;border:none;border-bottom:1px solid var(--b2);color:var(--t1);outline:none;">'
                 +'<div class="rest-minisec">'
                   +'<input type="number" min="0" max="59" inputmode="numeric" value="'+aRestMin+'" placeholder="0" oninput="updateAltRestMinSec('+ei+','+ai+',this.value,null)">'
                   +'<span>분</span>'
                   +'<input type="number" min="0" max="59" inputmode="numeric" value="'+aRestSecRem+'" placeholder="0" oninput="updateAltRestMinSec('+ei+','+ai+',null,this.value)">'
                   +'<span>초</span>'
                   +'</div>'
              )
              +'<button onclick="removeAlt('+ei+','+ai+')" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:0;justify-self:center;" title="삭제">✕</button>'
              +'</div>'
              +'</div>';
          });
          altHtml+='<div style="padding:6px 12px;border-bottom:1px solid var(--b1);">'
            +'<button onclick="addAlt('+ei+')" style="background:none;border:1px dashed var(--b2);border-radius:4px;color:var(--t3);cursor:pointer;font-size:11px;font-family:var(--fm);letter-spacing:.08em;padding:4px 10px;width:100%;text-align:center;">+ 대체 운동 추가</button>'
            +'</div>';
          return altHtml;
        })();
    }

    const warmupHtml='<div class="ex-section-head">'
      +'<span class="ex-section-label warmup">🔵 스트레칭 &amp; 선행운동</span>'

/* ── 드래그앤드롭 탭 (마우스 + 터치 지원) ── */
function buildDayTabs(){
  const p=getProg();if(!p)return;
  const container=document.getElementById('day-tabs-drag');if(!container)return;
  container.innerHTML='';

  p.days.forEach(function(d,i){
    const isRest=(d.type==='rest');
    const workoutNum=!isRest?p.days.slice(0,i+1).filter(function(x){return x.type!=='rest';}).length:0;
    const customLabel=(!isRest&&d.label&&!/^Day\s*\d+$/i.test(d.label.trim()))?(' · '+d.label):'';
    const label=isRest?'🌿 REST':('DAY '+workoutNum+customLabel);
    const btn=document.createElement('button');
    btn.className='day-tab'+(isRest?' rest-tab':'')+(editingDayIdx===i?' on':'');
    btn.textContent=label;
    btn.dataset.idx=i;
    btn.draggable=true;
    btn.style.cursor='grab';
    // 마우스 이벤트
    btn.addEventListener('click',function(){window.switchDay(i);});
    btn.addEventListener('dragstart',onTabDragStart);
    btn.addEventListener('dragover',onTabDragOver);
    btn.addEventListener('drop',onTabDrop);
    btn.addEventListener('dragend',onTabDragEnd);
    // 터치 이벤트
    btn.addEventListener('touchstart',onTabTouchStart,{passive:false});
    btn.addEventListener('touchmove',onTabTouchMove,{passive:false});
    btn.addEventListener('touchend',onTabTouchEnd,{passive:false});
    container.appendChild(btn);
  });
}

let dragSrcIdx=null;

/* ── 마우스 드래그 핸들러 ── */
function onTabDragStart(e){
  dragSrcIdx=parseInt(e.currentTarget.dataset.idx);
  e.currentTarget.style.opacity='0.45';
  e.dataTransfer.effectAllowed='move';
}
function onTabDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  const over=e.currentTarget;
  document.querySelectorAll('#day-tabs-drag .day-tab').forEach(function(b){b.style.outline='';});
  over.style.outline='2px solid var(--ac)';
}
function onTabDrop(e){
  e.preventDefault();
  const targetIdx=parseInt(e.currentTarget.dataset.idx);
  if(dragSrcIdx===null||dragSrcIdx===targetIdx)return;
  const p=getProg();if(!p)return;
  const moved=p.days.splice(dragSrcIdx,1)[0];
  p.days.splice(targetIdx,0,moved);
  if(editingDayIdx===dragSrcIdx){editingDayIdx=targetIdx;}
  else if(dragSrcIdx<editingDayIdx&&targetIdx>=editingDayIdx){editingDayIdx--;}
  else if(dragSrcIdx>editingDayIdx&&targetIdx<=editingDayIdx){editingDayIdx++;}
  dragSrcIdx=null;
  renderEditor();
}
function onTabDragEnd(e){
  e.currentTarget.style.opacity='';
  document.querySelectorAll('#day-tabs-drag .day-tab').forEach(function(b){b.style.outline='';});
  dragSrcIdx=null;
}

/* ── 터치 드래그 핸들러 ── */
let _touchDragSrcIdx=null;
let _touchClone=null;
let _touchOffsetX=0;
let _touchOffsetY=0;
let _touchMoved=false;

function onTabTouchStart(e){
  const btn=e.currentTarget;
  _touchDragSrcIdx=parseInt(btn.dataset.idx);
  _touchMoved=false;
  const touch=e.touches[0];
  const rect=btn.getBoundingClientRect();
  _touchOffsetX=touch.clientX-rect.left;
  _touchOffsetY=touch.clientY-rect.top;
}

function onTabTouchMove(e){
  if(_touchDragSrcIdx===null)return;
  const touch=e.touches[0];

  // 첫 움직임 감지 시 클론 생성
  if(!_touchClone){
    _touchMoved=true;
    const src=document.querySelector('#day-tabs-drag .day-tab[data-idx="'+_touchDragSrcIdx+'"]');
    if(!src)return;
    _touchClone=src.cloneNode(true);
    _touchClone.style.cssText='position:fixed;z-index:9999;opacity:0.85;pointer-events:none;'
      +'background:var(--s3);border:2px solid var(--ac);border-radius:4px;'
      +'padding:6px 16px;font-family:var(--fh);font-size:13px;font-weight:700;'
      +'font-style:italic;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);'
      +'white-space:nowrap;box-shadow:0 4px 20px rgba(255,106,0,.4);';
    document.body.appendChild(_touchClone);
    src.style.opacity='0.35';
  }

  e.preventDefault(); // 스크롤 방지

  // 클론 위치 업데이트
  _touchClone.style.left=(touch.clientX-_touchOffsetX)+'px';
  _touchClone.style.top=(touch.clientY-_touchOffsetY)+'px';

  // 현재 손가락 아래 버튼 하이라이트
  _touchClone.style.display='none';
  const el=document.elementFromPoint(touch.clientX,touch.clientY);
  _touchClone.style.display='';
  document.querySelectorAll('#day-tabs-drag .day-tab').forEach(function(b){b.style.outline='';});
  if(el){
    const target=el.closest('.day-tab');
    if(target&&target.dataset.idx!==String(_touchDragSrcIdx)){
      target.style.outline='2px solid var(--ac)';
    }
  }
}

function onTabTouchEnd(e){
  // 클론 제거 및 원본 복원
  if(_touchClone){_touchClone.remove();_touchClone=null;}
  document.querySelectorAll('#day-tabs-drag .day-tab').forEach(function(b){
    b.style.opacity='';b.style.outline='';
  });

  if(!_touchMoved){
    // 짧은 탭 → 일반 클릭으로 처리
    if(_touchDragSrcIdx!==null){window.switchDay(_touchDragSrcIdx);}
    _touchDragSrcIdx=null;
    return;
  }

  const touch=e.changedTouches[0];
  const el=document.elementFromPoint(touch.clientX,touch.clientY);
  if(el){
    const target=el.closest('.day-tab');
    if(target){
      const targetIdx=parseInt(target.dataset.idx);
      if(_touchDragSrcIdx!==null&&_touchDragSrcIdx!==targetIdx){
        const p=getProg();if(p){
          const moved=p.days.splice(_touchDragSrcIdx,1)[0];
          p.days.splice(targetIdx,0,moved);
          if(editingDayIdx===_touchDragSrcIdx){editingDayIdx=targetIdx;}
          else if(_touchDragSrcIdx<editingDayIdx&&targetIdx>=editingDayIdx){editingDayIdx--;}
          else if(_touchDragSrcIdx>editingDayIdx&&targetIdx<=editingDayIdx){editingDayIdx++;}
          renderEditor();
        }
      }
    }
  }
  _touchDragSrcIdx=null;
  _touchMoved=false;
}

/* ── 운동 행 드래그 (마우스+터치) ── */
(function(){
  let srcEi=null,clone=null,offX=0,offY=0,moved=false;

  function getContainer(){return document.querySelector('#prog-editor .card-body');}

  function getRowByEi(ei){return document.querySelector('.ex-row[data-ei="'+ei+'"]');}

  function allRows(){return Array.from(document.querySelectorAll('#prog-editor .ex-row'));}

  function clearOver(){allRows().forEach(function(r){r.classList.remove('ex-drag-over');});}

  function rowUnder(x,y){
    if(clone)clone.style.display='none';
    const el=document.elementFromPoint(x,y);
    if(clone)clone.style.display='';
    if(!el)return null;
    return el.closest('.ex-row');
  }

  function doReorder(targetEi){
    if(srcEi===null||targetEi===null||srcEi===targetEi)return;
    const p=getProg();if(!p)return;
    const exs=p.days[editingDayIdx].exercises;
    const moved2=exs.splice(srcEi,1)[0];
    exs.splice(targetEi,0,moved2);
    renderEditor();
  }

  /* 마우스 */
  document.addEventListener('mousedown',function(e){
    const handle=e.target.closest('.ex-drag-handle');
    if(!handle)return;
    e.preventDefault();
    srcEi=parseInt(handle.dataset.ei);moved=false;
    const row=getRowByEi(srcEi);if(!row)return;
    const rect=row.getBoundingClientRect();
    offX=e.clientX-rect.left;offY=e.clientY-rect.top;
  });
  document.addEventListener('mousemove',function(e){
    if(srcEi===null)return;
    if(!moved){
      moved=true;
      const row=getRowByEi(srcEi);if(!row)return;
      clone=row.cloneNode(true);
      const rect=row.getBoundingClientRect();
      clone.style.cssText='position:fixed;z-index:9999;opacity:.8;pointer-events:none;'
        +'width:'+rect.width+'px;background:var(--s3);border:1px solid var(--ac);border-radius:4px;'
        +'display:grid;gap:8px;padding:9px 12px;align-items:center;'
        +'grid-template-columns:28px 1fr 72px minmax(110px,auto) 28px 28px;';
      document.body.appendChild(clone);
      row.style.opacity='.3';
    }
    clone.style.left=(e.clientX-offX)+'px';
    clone.style.top=(e.clientY-offY)+'px';
    clearOver();
    const target=rowUnder(e.clientX,e.clientY);
    if(target&&parseInt(target.dataset.ei)!==srcEi)target.classList.add('ex-drag-over');
  });
  document.addEventListener('mouseup',function(e){
    if(srcEi===null)return;
    if(clone){clone.remove();clone=null;}
    clearOver();
    if(moved){
      const target=rowUnder(e.clientX,e.clientY);
      if(target)doReorder(parseInt(target.dataset.ei));
    }
    const row=getRowByEi(srcEi);if(row)row.style.opacity='';
    srcEi=null;moved=false;
  });

  /* 터치 */
  document.addEventListener('touchstart',function(e){
    const handle=e.target.closest('.ex-drag-handle');
    if(!handle)return;
    srcEi=parseInt(handle.dataset.ei);moved=false;
    const touch=e.touches[0];
    const row=getRowByEi(srcEi);if(!row)return;
    const rect=row.getBoundingClientRect();
    offX=touch.clientX-rect.left;offY=touch.clientY-rect.top;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(srcEi===null)return;
    e.preventDefault();
    const touch=e.touches[0];
    if(!moved){
      moved=true;
      const row=getRowByEi(srcEi);if(!row)return;
      clone=row.cloneNode(true);
      const rect=row.getBoundingClientRect();
      clone.style.cssText='position:fixed;z-index:9999;opacity:.8;pointer-events:none;'
        +'width:'+rect.width+'px;background:var(--s3);border:1px solid var(--ac);border-radius:4px;'
        +'display:grid;gap:8px;padding:9px 12px;align-items:center;'
        +'grid-template-columns:28px 1fr 72px minmax(110px,auto) 28px 28px;';
      document.body.appendChild(clone);
      row.style.opacity='.3';
    }
    clone.style.left=(touch.clientX-offX)+'px';
    clone.style.top=(touch.clientY-offY)+'px';
    clearOver();
    const target=rowUnder(touch.clientX,touch.clientY);
    if(target&&parseInt(target.dataset.ei)!==srcEi)target.classList.add('ex-drag-over');
  },{passive:false});
  document.addEventListener('touchend',function(e){
    if(srcEi===null)return;
    if(clone){clone.remove();clone=null;}
    clearOver();
    if(moved){
      const touch=e.changedTouches[0];
      const target=rowUnder(touch.clientX,touch.clientY);
      if(target)doReorder(parseInt(target.dataset.ei));
    }
    const row=getRowByEi(srcEi);if(row)row.style.opacity='';
    srcEi=null;moved=false;
  },{passive:true});
})();

function renderLog(){
  logOpenDay=null;
  document.getElementById('log-panel').classList.remove('on');
  const wl=getWeekLog();weekProgId=wl.progId||null;
  const dates=getWeekDates();
  const wkMon=toISO(dates[0]),wkSun=toISO(dates[6]);
  document.getElementById('week-title').innerHTML='<em>'+dates[0].getFullYear()+'</em> '+fmt(dates[0])+' — '+fmt(dates[6]);
  if(!weekProgId){const auto=getActiveProg();if(auto){weekProgId=auto.id;wl.progId=auto.id;setWeekLogLocal(wl);}}
  const chips=document.getElementById('prog-chips');chips.innerHTML='';
  if(!programs.length){
    chips.innerHTML='<span style="color:var(--t3);font-size:11px;font-family:var(--fm);">프로그램 없음</span>';
  }else{
    const sorted=[...programs].sort(function(a,b){
      if(!a.startDate&&!b.startDate)return 0;if(!a.startDate)return 1;if(!b.startDate)return -1;
      return b.startDate.localeCompare(a.startDate);
    });
    const nb=document.createElement('button');nb.className='prog-chip'+(weekProgId===null?' on':'');
    nb.textContent='없음';nb.onclick=function(){setWeekProg(null);};chips.appendChild(nb);
    sorted.forEach(function(p){
      const isMatch=p.startDate&&p.endDate&&wkMon<=p.endDate&&wkSun>=p.startDate;
      const c=document.createElement('button');c.className='prog-chip'+(weekProgId===p.id?' on':'');
      c.textContent=p.name+(isMatch?' ●':'');c.onclick=function(){setWeekProg(p.id);};chips.appendChild(c);
    });
  }
  const selProg=weekProgId?programs.find(function(p){return p.id===weekProgId;}):null;
  const di=document.getElementById('prog-date-info');
  if(di)di.textContent=(selProg&&selProg.startDate&&selProg.endDate)?fmtDate(selProg.startDate)+' — '+fmtDate(selProg.endDate):'';
  renderDayGrid();renderStats();
}

function setWeekProg(id){const wl=getWeekLog();wl.progId=id;weekProgId=id;setWeekLogLocal(wl);renderLog();}

function renderDayGrid(){
  const dates=getWeekDates();const wl=getWeekLog();
  const prog=weekProgId?programs.find(function(p){return p.id===weekProgId;}):null;
  const grid=document.getElementById('day-grid');grid.innerHTML='';
  const todayStr=toISO(new Date());
  let progDayIdx=0; // index into prog.days (includes rest days)
  for(let i=0;i<7;i++){
    const dl=wl.days[i]||{};
    const isToday=toISO(dates[i])===todayStr;
    const numDays=prog?prog.days.length:0;
    // assign prog day sequentially (rest days included)
    const pd=(progDayIdx<numDays&&prog)?prog.days[progDayIdx]:null;
    if(progDayIdx<numDays)progDayIdx++;
    const isProgRest=pd&&pd.type==='rest';
    const isRestDay=isProgRest; // only prog-defined rest
    const isDone=!!dl.done;
    const hasLog=dl.log&&dl.log.some(function(r){
      return r.sets&&r.sets.some&&r.sets.some(function(s){return s.weight||s.reps;});
    });
    const card=document.createElement('div');
    card.className='day-card'+(logOpenDay===i?' open':'')+(isDone?' done':'')+(isRestDay?' is-weekend':'')+(isToday?' is-today':'');
    const dotCls=isDone?'done':hasLog?'has':'';
    let preview;
    if(isRestDay){
      preview='<span style="color:var(--t3);">🌿 휴식</span>';
    }else if(pd&&pd.exercises&&pd.exercises.length){
      preview='<strong>'+(pd.exercises[0].name||'운동')+'</strong>'+(pd.exercises.length>1?' 외 '+(pd.exercises.length-1)+'종목':'');
    }else{
      preview='<span style="color:var(--t3);">기록 없음</span>';
    }
    // workout day number (non-rest)
    const workoutNum=pd&&!isRestDay?(prog.days.slice(0,progDayIdx).filter(d=>d.type!=='rest').length):0;
    card.innerHTML='<div class="day-card-head"><div>'
      +'<div class="day-card-num">'+DAYS_KO[i]+'</div>'
      +'<div class="day-card-date">'+fmt(dates[i])+(pd?' · '+(isRestDay?'REST':pd.label):'')+'</div>'
      +'</div><div class="day-dot '+dotCls+'"></div></div>'
      +'<div class="day-card-body">'
      +(pd&&!isRestDay?'<div class="day-card-label">DAY '+workoutNum+'</div>':'')
      +(isRestDay?'<div class="day-card-label" style="color:var(--t3)">REST</div>':'')
      +'<div class="day-preview">'+preview+'</div>'
      +(isDone?'<div class="day-done-tag">✓ DONE</div>':'')
      +'</div>';
    if(!isRestDay)(function(idx){card.addEventListener('click',function(){openLogPanel(idx);});})(i);
    grid.appendChild(card);
  }
}

function renderStats(){
  const wl=getWeekLog();let done=0,sets=0,vol=0;
  const prog=weekProgId?programs.find(function(p){return p.id===weekProgId;}):null;
  const numWorkoutDays=prog?prog.days.filter(function(d){return d.type!=='rest';}).length:5;
  for(let i=0;i<7;i++){
    const dl=wl.days[i]||{};if(dl.done)done++;
    (dl.log||[]).forEach(function(ex){
      (ex.sets||[]).forEach(function(set){
        sets++;
        vol+=(parseFloat(set.weight)||0)*(parseInt(set.reps)||0);
      });
    });
  }
  const pct=numWorkoutDays>0?Math.round(done/numWorkoutDays*100):0;
  document.getElementById('st0').querySelector('.stat-val').innerHTML='<em>'+done+'</em><span class="stat-unit">일</span>';
  document.getElementById('st1').querySelector('.stat-val').innerHTML='<em>'+sets+'</em><span class="stat-unit">세트</span>';
  document.getElementById('st2').querySelector('.stat-val').innerHTML='<em>'+Math.round(vol).toLocaleString()+'</em><span class="stat-unit">kg</span>';
  document.getElementById('st3').querySelector('.stat-val').innerHTML='<em>'+pct+'</em><span class="stat-unit">%</span>';
  document.getElementById('prog-bar-pct').textContent=done+' / '+numWorkoutDays+'일';
  document.getElementById('prog-bar-fill').style.width=Math.min(pct,100)+'%';
  setTimeout(function(){document.querySelectorAll('.stat').forEach(function(s){s.classList.add('loaded');});},80);
}

function openLogPanel(i){
  if(logOpenDay===i){closeLogPanel();return;}
  logOpenDay=i;renderDayGrid();
  const prog=weekProgId?programs.find(function(p){return p.id===weekProgId;}):null;
  const numDays=prog?prog.days.length:0;
  const pd=(i<numDays&&prog)?prog.days[i]:null;
  if(pd&&pd.type==='rest'){closeLogPanel();return;}
  const wl=getWeekLog();const dl=wl.days[i]||{};
  const workoutNum=pd?prog.days.slice(0,i+1).filter(d=>d.type!=='rest').length:i+1;
  document.getElementById('lp-title-day').textContent='DAY 0'+workoutNum+' ';
  document.getElementById('lp-title-name').textContent=pd?pd.label:'';
  const btn=document.getElementById('btn-done');
  btn.textContent=dl.done?'✓ 완료됨':'완료 체크';btn.classList.toggle('filled',!!dl.done);
  const body=document.getElementById('lp-body');
  if(!prog||!pd){body.innerHTML='<div style="color:var(--t2);font-size:13px;padding:12px 0;font-family:var(--fm);">프로그램을 먼저 선택해주세요.</div>';}
  else{renderLogBody(body,dl,pd,wl,i,false);}
  document.getElementById('log-panel').classList.add('on');
  document.getElementById('log-panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}
window.closeLogPanel=function(){logOpenDay=null;document.getElementById('log-panel').classList.remove('on');renderDayGrid();};

/* ══════════════════════════════════
   운동 기록 렌더
   운동명(고정) + 세트별 중량·횟수
══════════════════════════════════ */
function makeEmptyLog(pd){
  return (pd.exercises||[]).map(function(ex){
    const isCardio=(ex.exType==='cardio');
    if(isCardio){
      return {name:ex.name,exType:'cardio',duration:ex.duration||'',done:false};
    }
    const sets=parseInt(ex.sets)||3;
    return {
      name:ex.name,
      exType:'strength',
      rest:ex.rest||'',
      sets:Array.from({length:sets},function(){return {weight:'',reps:'',done:false};})
    };
  });
}

function fmtRest(sec){
  const s=parseInt(sec)||0;if(!s)return '—';
  const m=Math.floor(s/60),r=s%60;
  return m>0?(r>0?m+'분 '+r+'초':m+'분'):r+'초';
}

function renderLogBody(body,dl,pd,wl,dayIdx,isToday){
  if(!dl.log||dl.log.length!==pd.exercises.length){
    dl.log=makeEmptyLog(pd);
    wl.days[dayIdx]=dl;setWeekLogLocal(wl);
  }
  const saveF=isToday?'saveTodayLog('+dayIdx+')':'saveLogDay('+dayIdx+')';
  const chkF=isToday?'toggleExDoneToday':'toggleExDone';
  const wkOff=isToday?0:'undefined';

  // 섹션별 그룹
  const warmups=pd.exercises.map((ex,i)=>({ex,i})).filter(({ex})=>ex.section==='warmup');
  const mains=pd.exercises.map((ex,i)=>({ex,i})).filter(({ex})=>ex.section!=='warmup');

  function renderExBlock(exDef,ei){
    const ex=dl.log[ei];
    const isCardio=(ex.exType==='cardio'||exDef.exType==='cardio');
    const sets=parseInt(exDef.sets)||ex.sets&&ex.sets.length||3;
    const restTxt=fmtRest(exDef.rest);
    const metaText=isCardio?'유산소 · '+(exDef.duration||ex.duration||'?')+'분':sets+'세트 · 휴식 '+restTxt;
    const alts=(Array.isArray(exDef.alts)&&exDef.alts.length
      ?exDef.alts.map(a=>typeof a==='object'&&a?a:{name:a||''}).filter(a=>a.name&&a.name.trim())
      :(exDef.alt?[{name:exDef.alt}]:[]));
    const hasAlt=alts.length>0;
    const altIdx=(typeof ex.altIdx==='number'&&ex.altIdx>=0&&ex.altIdx<alts.length)?ex.altIdx:-1;
    const usingAlt=altIdx>=0;
    const activeEx=usingAlt?alts[altIdx]:exDef;  // 대체 선택시 해당 대체 운동 정의 사용
    const displayName=usingAlt?alts[altIdx].name:(ex.name||exDef.name||'운동');
    // 대체 선택시 세트/휴식/유산소 정보를 대체 운동 기준으로
    const activeIsCardio=usingAlt?(activeEx.exType==='cardio'):isCardio;
    const activeSets=usingAlt?parseInt(activeEx.sets)||3:parseInt(exDef.sets)||ex.sets&&ex.sets.length||3;
    const activeRestTxt=usingAlt?fmtRest(activeEx.rest):restTxt;
    const activeMetaText=activeIsCardio?'유산소 · '+(activeEx.duration||'?')+'분':activeSets+'세트 · 휴식 '+activeRestTxt;
    // 대체 버튼: 여러개면 순환, 하나면 토글
    const altBtnLabel=usingAlt?'원래':('대체'+(alts.length>1?' ▾':''));
    const altBtnClick=usingAlt
      ?'selectAltEx('+dayIdx+','+ei+',-1,'+wkOff+')'
      :(alts.length===1?'selectAltEx('+dayIdx+','+ei+',0,'+wkOff+')':'showAltMenu(this,'+dayIdx+','+ei+','+wkOff+')');

    let block='<div class="log-ex-block">'
      +'<div class="log-ex-header">'
      +'<div class="log-ex-header-left">'
      +'<div class="log-ex-title">'+displayName
      +(usingAlt?'<span style="font-size:10px;color:var(--ac2);font-family:var(--fm);margin-left:6px;letter-spacing:.06em;">대체중</span>':'')
      +'</div>'
      +'<div class="log-ex-meta">'+activeMetaText+'</div>'
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:6px;">'
      +(hasAlt?'<button class="btn-alt'+(usingAlt?' active':'')+'" onclick="'+altBtnClick+'">'+altBtnLabel+'</button>':'')
      +'<button class="log-check'+(ex.done?' on':'')+'" onclick="'+chkF+'('+dayIdx+','+ei+')">'+(ex.done?'✓':'')+'</button>'
      +'</div>'
      +'</div>';

    if(isCardio){
      const tField=isToday
        ?'updateSetFieldWeek('+dayIdx+','+ei+',0,\'time\',this.value,0)'
        :'updateSetField('+dayIdx+','+ei+',0,\'time\',this.value)';
      const curTime=(ex.sets&&ex.sets[0]&&ex.sets[0].time)||'';
      block+='<div class="log-sets-table">'
        +'<div style="display:flex;align-items:center;gap:10px;padding:10px 0;">'
        +'<span style="font-family:var(--fm);font-size:10px;color:var(--t3);letter-spacing:.12em;text-transform:uppercase;">실제 시간</span>'
        +'<input class="log-field-input" type="number" min="0" step="0.5" inputmode="decimal" style="width:80px;"'
        +' value="'+curTime+'" placeholder="—" oninput="'+tField+';autoCheckCardio('+dayIdx+','+ei+','+(isToday?0:'undefined')+')">'
        +'<span style="font-family:var(--fm);font-size:11px;color:var(--t3);">분</span>'
        +'</div></div>';
    }else{
      block+='<div class="log-sets-table">'
        +'<div class="log-sets-head"><span>SET</span><span>중량(kg)</span><span>횟수</span></div>';
      (ex.sets||[]).forEach(function(set,si){
        const wField=isToday
          ?'updateSetFieldWeek('+dayIdx+','+ei+','+si+',\'weight\',this.value,0)'
          :'updateSetField('+dayIdx+','+ei+','+si+',\'weight\',this.value)';
        const rField=isToday
          ?'updateSetFieldWeek('+dayIdx+','+ei+','+si+',\'reps\',this.value,0)'
          :'updateSetField('+dayIdx+','+ei+','+si+',\'reps\',this.value)';
        const autoChk='autoCheckSets('+dayIdx+','+ei+','+(isToday?0:'undefined')+')';
        block+='<div class="log-set-row'+(set.done?' set-done':'')+'">'
          +'<div class="log-set-num">'+(si+1)+'</div>'
          +'<input class="log-field-input" type="number" min="0" step="0.5" inputmode="decimal"'
          +' value="'+(set.weight||'')+'" placeholder="—"'
          +' oninput="'+wField+';'+autoChk+'">'
          +'<input class="log-field-input" type="number" min="0" inputmode="numeric"'
          +' value="'+(set.reps||'')+'" placeholder="—"'
          +' oninput="'+rField+';'+autoChk+'">'
          +'</div>';
      });
      block+='</div>';
    }
    block+='</div>';
    return block;
  }

  let html='';

  if(warmups.length){
    html+='<div style="font-family:var(--fm);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7ec8e3;padding:10px 0 6px;">🔵 스트레칭 &amp; 선행운동</div>';
    warmups.forEach(({ex:exDef,i})=>{ html+=renderExBlock(exDef,i); });
  }
  if(mains.length){
    html+='<div style="font-family:var(--fm);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ac2);padding:10px 0 6px;">🔶 본운동</div>';
    mains.forEach(({ex:exDef,i})=>{ html+=renderExBlock(exDef,i); });
  }
  if(!warmups.length&&!mains.length){
    html='<div style="color:var(--t2);font-size:13px;padding:12px 0;font-family:var(--fm);">운동이 없습니다.</div>';
  }

  html+='<div style="margin-top:16px;"><span class="sec-label">메모</span>'
    +'<textarea class="inp" rows="2" placeholder="오늘의 컨디션, 느낀 점…"'
    +' oninput="updateNotes('+dayIdx+',this.value)">'+(dl.notes||'')+'</textarea></div>'
    +'<div class="log-bottom">'
    +'<button class="btn btn-primary" onclick="'+saveF+'">SAVE</button>'
    +'</div>';

  body.innerHTML=html;
}
