// 대체 운동 선택 (idx=-1이면 원래로)
window.selectAltEx=function(di,ei,idx,weekOff){
  // weekOff가 숫자면 오늘의기록/주간기록 공통, 'undefined'문자열이면 주간기록 패널
  const isPanel=(weekOff==='undefined'||weekOff===undefined);
  const off=isPanel?weekOffset:(typeof weekOff==='number'?weekOff:parseInt(weekOff)||0);
  const wl=getWeekLog(off);
  const dl=wl.days[di]||{};
  if(!dl.log||!dl.log[ei])return;
  dl.log[ei].altIdx=idx;

  // 대체 운동 세트 수 맞춤
  if(idx>=0){
    const prog=programs.find(p=>p.id==(wl.progId||''));
    if(prog&&prog.days&&prog.days[di]){
      const exDef=(prog.days[di].exercises||[])[ei]||{};
      const alts=(Array.isArray(exDef.alts)?exDef.alts:[]).map(a=>typeof a==='object'&&a?a:{name:a||''});
      const altDef=alts[idx];
      if(altDef){
        const isCardio=(altDef.exType==='cardio');
        const cur=dl.log[ei].sets||[];
        dl.log[ei].sets=isCardio?[{}]:Array.from({length:parseInt(altDef.sets)||3},(_,si)=>cur[si]||{weight:'',reps:'',done:false});
      }
    }
  }

  wl.days[di]=dl;
  setWeekLogLocal(wl,off);
  const menu=document.getElementById('alt-menu-popup');
  if(menu)menu.remove();
  if(isPanel){openLogPanel(di);}
  else{renderToday();}
};
// 대체 운동 여러 개일 때 팝업 메뉴
window.showAltMenu=function(btn,di,ei,weekOff){
  const existing=document.getElementById('alt-menu-popup');
  if(existing){existing.remove();return;}
  const isPanel=(weekOff==='undefined'||weekOff===undefined);
  const off=isPanel?weekOffset:(typeof weekOff==='number'?weekOff:parseInt(weekOff)||0);
  const wl=getWeekLog(off);
  const prog=programs.find(p=>p.id==(wl.progId||''));
  let alts=[];
  if(prog&&prog.days&&prog.days[di]){
    const exDef=(prog.days[di].exercises||[])[ei]||{};
    alts=(Array.isArray(exDef.alts)?exDef.alts:[]).map(a=>typeof a==='object'&&a?a:{name:a||''}).filter(a=>a.name&&a.name.trim());
  }
  if(!alts.length)return;

  const popup=document.createElement('div');
  popup.id='alt-menu-popup';
  popup.style.cssText='position:fixed;z-index:9999;background:var(--s2);border:1px solid var(--b2);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:180px;overflow:hidden;';
  const rect=btn.getBoundingClientRect();
  popup.style.top=(rect.bottom+6)+'px';
  popup.style.left=Math.min(rect.left,window.innerWidth-200)+'px';

  let inner='<div style="padding:8px 12px;font-family:var(--fm);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--b1);">대체 운동 선택</div>';
  alts.forEach(function(a,ai){
    inner+='<button onclick="selectAltEx('+di+','+ei+','+ai+','+weekOff+')" style="display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;color:var(--t1);font-size:13px;cursor:pointer;border-bottom:1px solid rgba(37,37,48,.5);">'+a.name+'<\/button>';
  });
  popup.innerHTML=inner;
  document.body.appendChild(popup);
  setTimeout(function(){
    document.addEventListener('click',function h(e){
      if(!popup.contains(e.target)&&e.target!==btn){popup.remove();document.removeEventListener('click',h);}
    },{capture:true});
  },0);
};
window.updateSetField=function(di,ei,si,field,val){
  const wl=getWeekLog();const dl=wl.days[di]||{};
  if(!dl.log||!dl.log[ei])return;
  if(!dl.log[ei].sets)dl.log[ei].sets=[{weight:'',reps:'',done:false}];
  dl.log[ei].sets[si][field]=val;
  wl.days[di]=dl;setWeekLogLocal(wl);
};
// 모든 세트에 중량+횟수가 입력되면 자동 체크
window.autoCheckSets=function(di,ei,weekOff){
  const isWeek=(weekOff!==undefined);
  const wl=isWeek?getWeekLog(weekOff):getWeekLog();
  const dl=wl.days[di]||{};
  if(!dl.log||!dl.log[ei]||!dl.log[ei].sets)return;
  const allFilled=dl.log[ei].sets.every(function(s){return (s.weight!==''&&s.weight!==null&&s.weight!==undefined)&&(s.reps!==''&&s.reps!==null&&s.reps!==undefined);});
  if(allFilled&&!dl.log[ei].done){
    dl.log[ei].done=true;
    wl.days[di]=dl;
    if(isWeek){setWeekLogLocal(wl,weekOff);renderToday();}
    else{setWeekLogLocal(wl);openLogPanel(di);}
  }
};
window.autoCheckCardio=function(di,ei,weekOff){
  const isWeek=(weekOff!==undefined);
  const wl=isWeek?getWeekLog(weekOff):getWeekLog();
  const dl=wl.days[di]||{};
  if(!dl.log||!dl.log[ei])return;
  const hasTime=dl.log[ei].sets&&dl.log[ei].sets[0]&&dl.log[ei].sets[0].time;
  if(hasTime&&!dl.log[ei].done){
    dl.log[ei].done=true;
    wl.days[di]=dl;
    if(isWeek){setWeekLogLocal(wl,weekOff);renderToday();}
    else{setWeekLogLocal(wl);openLogPanel(di);}
  }
};
window.updateNotes=function(di,val){
  const wl=getWeekLog();wl.days[di]=wl.days[di]||{};wl.days[di].notes=val;setWeekLogLocal(wl);
};
window.toggleExDone=function(di,ei){
  const wl=getWeekLog();const dl=wl.days[di]||{};if(!dl.log)return;
  dl.log[ei].done=!dl.log[ei].done;wl.days[di]=dl;setWeekLogLocal(wl);openLogPanel(di);
};
window.toggleDone=function(){
  const wl=getWeekLog();const dl=wl.days[logOpenDay]||{};
  dl.done=!dl.done;wl.days[logOpenDay]=dl;setWeekLogLocal(wl);
  openLogPanel(logOpenDay);renderDayGrid();renderStats();
};
window.saveLogDay=async function(i){
  await saveWeekLog(weekOffset);renderDayGrid();renderStats();toast('✓ 저장됨','var(--green)');
};
window.changeWeek=function(dir){weekOffset+=dir;renderLog();};

/* ══════════════════════════════════
   오늘의 기록 탭
══════════════════════════════════ */

function renderToday(){
  const realToday=new Date();
  const todayStr=toISO(realToday);

  // 선택된 날짜 (없으면 오늘)
  if(!todaySelectedDate)todaySelectedDate=todayStr;
  window._todaySelectedDate=todaySelectedDate;

  // 선택 날짜 기준 주간 정보
  const selDate=new Date(todaySelectedDate+'T00:00:00');
  const selDow=selDate.getDay();
  const selWeekDow=(selDow+6)%7; // 월=0 ... 일=6

  // 선택 날짜가 속한 주의 weekOffset 계산
  const todayMon=new Date(realToday);
  todayMon.setDate(realToday.getDate()-((realToday.getDay()+6)%7));
  const selMon=new Date(selDate);
  selMon.setDate(selDate.getDate()-selWeekDow);
  const diffMs=selMon-todayMon;
  const selWeekOff=Math.round(diffMs/(7*24*3600*1000));

  const wkDates=getWeekDates(selWeekOff);
  const wl=getWeekLog(selWeekOff);
  const prog=getActiveProg(selWeekOff);
  if(!wl.progId&&prog){wl.progId=prog.id;setWeekLogLocal(wl,selWeekOff);}
  const activeProg=wl.progId?programs.find(function(p){return p.id===wl.progId;}):null;

  // 날짜 선택 헤더
  const dateHeader=document.getElementById('today-date-selector');
  if(dateHeader){
    dateHeader.value=todaySelectedDate;
  }

  const strip=document.getElementById('today-week-strip');
  strip.innerHTML='';
  wkDates.forEach(function(d,i){
    const dStr=toISO(d);
    const isToday=dStr===todayStr;
    const isSel=dStr===todaySelectedDate;
    const dl=wl.days[i]||{};
    const div=document.createElement('div');
    div.className='twday'+(isToday?' is-today':'')+(isSel?' is-selected':'')+(dl.done?' is-done':'');
    div.innerHTML='<div class="twday-name">'+DAYS_KO[i]+'</div><div class="twday-date">'+fmt(d)+'</div>';
    div.style.cursor='pointer';
    (function(dateStr){div.addEventListener('click',function(){todaySelectedDate=dateStr;renderToday();});})(dStr);
    strip.appendChild(div);
  });

  const heroWrap=document.getElementById('today-hero-wrap');
  const logWrap=document.getElementById('today-log-wrap');

  if(!activeProg){
    heroWrap.innerHTML='<div class="today-no-prog"><span class="big">📋 프로그램 없음</span>프로그램 설계 탭에서 프로그램을 만들고<br>날짜를 설정해주세요.</div>';
    logWrap.innerHTML='';return;
  }

  // 프로그램 day 수에 맞게 인덱스 처리
  const numProgDays=activeProg.days.length;
  const progDayIdx=Math.min(selWeekDow,numProgDays-1);
  const pd=activeProg.days[progDayIdx];
  const isProgRestDay=pd&&pd.type==='rest';

  if(isProgRestDay){
    heroWrap.innerHTML='<div class="today-hero"><div class="today-hero-left">'
      +'<div class="today-date-label">'+fmtDate(todaySelectedDate)+'</div>'
      +'<div class="today-day-title">🌿 REST</div>'
      +'<div class="today-day-sub">휴식일 — 충분한 휴식을 취하세요</div>'
      +'<div class="today-prog-name">'+activeProg.name+'</div></div>'
      +'<div class="today-badge rest">휴식일</div></div>';
    logWrap.innerHTML='';return;
  }

  // 운동 day 번호 (휴식 제외 카운트)
  const workoutDayNum=activeProg.days.slice(0,progDayIdx+1).filter(function(d){return d.type!=='rest';}).length;
  const dl=wl.days[selWeekDow]||{};
  const isDone=!!dl.done;
  const isPast=todaySelectedDate<todayStr;

  heroWrap.innerHTML='<div class="today-hero"><div class="today-hero-left">'
    +'<div class="today-date-label">'+fmtDate(todaySelectedDate)+(isPast?' · <span style="color:var(--gold);font-size:10px;">과거 기록</span>':'')+'</div>'
    +'<div class="today-day-title"><em>DAY 0'+workoutDayNum+'</em></div>'
    +'<div class="today-day-sub">'+pd.label+'</div>'
    +'<div class="today-prog-name">'+activeProg.name+'</div></div>'
    +(isDone?'<div class="today-badge done">✓ 완료</div>':'<div class="today-badge todo">기록하기</div>')
    +'</div>';

  logWrap.innerHTML='<div class="today-panel">'
    +'<div class="today-panel-head">'
    +'<div class="today-panel-title"><em>DAY 0'+workoutDayNum+'</em>'+pd.label+'</div>'
    +'<button class="btn btn-sm btn-gold'+(isDone?' filled':'')+'" id="btn-today-done" onclick="toggleTodayDone('+selWeekDow+','+selWeekOff+')">'+(isDone?'✓ 완료됨':'완료 체크')+'</button>'
    +'</div>'
    +'<div class="today-panel-body" id="today-log-body"></div>'
    +'</div>';

  renderLogBodyToday(document.getElementById('today-log-body'),dl,pd,wl,selWeekDow,selWeekOff);
}

function renderLogBodyToday(body,dl,pd,wl,dayIdx,weekOff){
  if(!dl.log||dl.log.length!==pd.exercises.length){
    dl.log=makeEmptyLog(pd);
    wl.days[dayIdx]=dl;setWeekLogLocal(wl,weekOff);
  }
  // renderLogBody의 isToday=true 경로 재사용하되 weekOff 기반 저장 함수로 오버라이드
  const saveF='saveTodayLogWeek('+dayIdx+','+weekOff+')';
  const chkF='toggleExDoneTodayWeek';
  const warmups=pd.exercises.map((ex,i)=>({ex,i})).filter(({ex})=>ex.section==='warmup');
  const mains=pd.exercises.map((ex,i)=>({ex,i})).filter(({ex})=>ex.section!=='warmup');

  function renderExBlock(exDef,ei){
    const ex=dl.log[ei];
    const isCardio=(ex.exType==='cardio'||exDef.exType==='cardio');
    const sets=parseInt(exDef.sets)||ex.sets&&ex.sets.length||3;
    const restTxt=fmtRest(exDef.rest);
    const metaText=isCardio?'유산소 · '+(exDef.duration||ex.duration||'?')+'분':sets+'세트 · 휴식 '+restTxt;
    const alts=(Array.isArray(exDef.alts)&&exDef.alts.length
      ?exDef.alts.map(a=>typeof a==='object'&&a?a:{name:a||''}).filter(a=>a.name&&a.name.trim())
      :(exDef.alt?[{name:exDef.alt}]:[]));
    const hasAlt=alts.length>0;
    const altIdx=(typeof ex.altIdx==='number'&&ex.altIdx>=0&&ex.altIdx<alts.length)?ex.altIdx:-1;
    const usingAlt=altIdx>=0;
    const activeEx=usingAlt?alts[altIdx]:exDef;  // 대체 선택시 해당 대체 운동 정의 사용
    const displayName=usingAlt?alts[altIdx].name:(ex.name||exDef.name||'운동');
    // 대체 선택시 세트/휴식/유산소 정보를 대체 운동 기준으로
    const activeIsCardio=usingAlt?(activeEx.exType==='cardio'):isCardio;
    const activeSets=usingAlt?parseInt(activeEx.sets)||3:parseInt(exDef.sets)||ex.sets&&ex.sets.length||3;
    const activeRestTxt=usingAlt?fmtRest(activeEx.rest):restTxt;
    const activeMetaText=activeIsCardio?'유산소 · '+(activeEx.duration||'?')+'분':activeSets+'세트 · 휴식 '+activeRestTxt;
    const altBtnLabel=usingAlt?'원래':('대체'+(alts.length>1?' ▾':''));
    const altBtnClick=usingAlt
      ?'selectAltEx('+dayIdx+','+ei+',-1,'+weekOff+')'
      :(alts.length===1?'selectAltEx('+dayIdx+','+ei+',0,'+weekOff+')':'showAltMenu(this,'+dayIdx+','+ei+','+weekOff+')');

    let block='<div class="log-ex-block">'
      +'<div class="log-ex-header">'
      +'<div class="log-ex-header-left">'
      +'<div class="log-ex-title">'+displayName
      +(usingAlt?'<span style="font-size:10px;color:var(--ac2);font-family:var(--fm);margin-left:6px;letter-spacing:.06em;">대체중</span>':'')
      +'</div>'
      +'<div class="log-ex-meta">'+activeMetaText+'</div>'
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:6px;">'
      +(hasAlt?'<button class="btn-alt'+(usingAlt?' active':'')+'" onclick="'+altBtnClick+'">'+altBtnLabel+'</button>':'')
      +'<button class="log-check'+(ex.done?' on':'')+'" onclick="'+chkF+'('+dayIdx+','+ei+','+weekOff+')">'+(ex.done?'✓':'')+'</button>'
      +'</div>'
      +'</div>';

    if(isCardio){
      const curTime=(ex.sets&&ex.sets[0]&&ex.sets[0].time)||'';
      block+='<div class="log-sets-table"><div style="display:flex;align-items:center;gap:10px;padding:10px 0;">'
        +'<span style="font-family:var(--fm);font-size:10px;color:var(--t3);letter-spacing:.12em;text-transform:uppercase;">실제 시간</span>'
        +'<input class="log-field-input" type="number" min="0" step="0.5" inputmode="decimal" style="width:80px;"'
        +' value="'+curTime+'" placeholder="—"'
        +' oninput="updateSetFieldWeek('+dayIdx+','+ei+',0,\'time\',this.value,'+weekOff+');autoCheckCardio('+dayIdx+','+ei+','+weekOff+')">'
        +'<span style="font-family:var(--fm);font-size:11px;color:var(--t3);">분</span>'
        +'</div></div>';
    }else{
      block+='<div class="log-sets-table"><div class="log-sets-head"><span>SET</span><span>중량(kg)</span><span>횟수</span></div>';
      (ex.sets||[]).forEach(function(set,si){
        block+='<div class="log-set-row'+(set.done?' set-done':'')+'">'
          +'<div class="log-set-num">'+(si+1)+'</div>'
          +'<input class="log-field-input" type="number" min="0" step="0.5" inputmode="decimal"'
          +' value="'+(set.weight||'')+'" placeholder="—"'
          +' oninput="updateSetFieldWeek('+dayIdx+','+ei+','+si+',\'weight\',this.value,'+weekOff+');autoCheckSets('+dayIdx+','+ei+','+weekOff+')">'
          +'<input class="log-field-input" type="number" min="0" inputmode="numeric"'
          +' value="'+(set.reps||'')+'" placeholder="—"'
          +' oninput="updateSetFieldWeek('+dayIdx+','+ei+','+si+',\'reps\',this.value,'+weekOff+');autoCheckSets('+dayIdx+','+ei+','+weekOff+')">'
          +'</div>';
      });
      block+='</div>';
    }
    return block+'</div>';
  }

  let html='';
  if(warmups.length){
    html+='<div style="font-family:var(--fm);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7ec8e3;padding:10px 0 6px;">🔵 스트레칭 &amp; 선행운동</div>';
    warmups.forEach(({ex:exDef,i})=>{ html+=renderExBlock(exDef,i); });
  }
  if(mains.length){
    html+='<div style="font-family:var(--fm);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ac2);padding:10px 0 6px;">🔶 본운동</div>';
    mains.forEach(({ex:exDef,i})=>{ html+=renderExBlock(exDef,i); });
  }
  html+='<div style="margin-top:16px;"><span class="sec-label">메모</span>'
    +'<textarea class="inp" rows="2" placeholder="오늘의 컨디션, 느낀 점…"'
    +' oninput="updateNotesWeek('+dayIdx+',this.value,'+weekOff+')">'+(dl.notes||'')+'</textarea></div>'
    +'<div class="log-bottom"><button class="btn btn-primary" onclick="'+saveF+'">SAVE</button></div>';
  body.innerHTML=html;
}

window.updateSetFieldWeek=function(di,ei,si,field,val,weekOff){
  const wl=getWeekLog(weekOff);const dl=wl.days[di]||{};
  if(!dl.log||!dl.log[ei])return;
  if(!dl.log[ei].sets)dl.log[ei].sets=[{}];
  if(!dl.log[ei].sets[si])dl.log[ei].sets[si]={};
  dl.log[ei].sets[si][field]=val;
  wl.days[di]=dl;setWeekLogLocal(wl,weekOff);
};
window.updateNotesWeek=function(di,val,weekOff){
  const wl=getWeekLog(weekOff);wl.days[di]=wl.days[di]||{};wl.days[di].notes=val;setWeekLogLocal(wl,weekOff);
};
window.toggleExDoneTodayWeek=function(di,ei,weekOff){
  const wl=getWeekLog(weekOff);const dl=wl.days[di]||{};if(!dl.log)return;
  dl.log[ei].done=!dl.log[ei].done;wl.days[di]=dl;setWeekLogLocal(wl,weekOff);
  renderToday();
};

window.toggleTodayDone=async function(di,weekOff){
  if(weekOff===undefined)weekOff=0;
  const wl=getWeekLog(weekOff);const dl=wl.days[di]||{};
  dl.done=!dl.done;wl.days[di]=dl;setWeekLogLocal(wl,weekOff);
  await saveWeekLog(weekOff);renderToday();toast(dl.done?'✓ 완료!':'완료 취소',dl.done?'var(--green)':'var(--ac)');
};
window.toggleExDoneToday=function(di,ei){
  const wl=getWeekLog(0);const dl=wl.days[di]||{};if(!dl.log)return;
  dl.log[ei].done=!dl.log[ei].done;wl.days[di]=dl;setWeekLogLocal(wl,0);
  renderToday();
};
window.saveTodayLog=async function(di){
  await saveWeekLog(0);renderToday();toast('✓ 저장됨','var(--green)');
};
window.saveTodayLogWeek=async function(di,weekOff){
  if(weekOff===undefined)weekOff=0;
  await saveWeekLog(weekOff);renderToday();toast('✓ 저장됨','var(--green)');
};

/* ── 초기 캐시 로드 ── */
programs=lsLoad('rtp_programs_tiger')||[];
logs=lsLoad('rtp_logs_tiger')||{};

// 심장박동은 CSS animation으로 처리
// 심장박동 JS 루프: 왼쪽부터 그리고 → 완성 후 싹 지우고 → 반복
(function(){
  const line = document.querySelector('.hb-line');
  if(!line) return;
  const TOTAL = 520;
  const DRAW_MS = 2200;   // 그리는 시간
  const HOLD_MS = 300;    // 완성 후 잠깐 유지
  const PAUSE_MS = 400;   // 지운 후 쉬는 시간

  function easeOut(t){ return 1 - Math.pow(1-t, 3); }

  function runLoop(){
    // 1) 지운 상태에서 시작
    line.style.strokeDashoffset = TOTAL;
    line.style.opacity = '1';

    // 2) 왼쪽부터 그리기
    const start = performance.now();
    function draw(now){
      const elapsed = now - start;
      const t = Math.min(elapsed / DRAW_MS, 1);
      const offset = TOTAL * (1 - easeOut(t));
      line.style.strokeDashoffset = offset;
      if(t < 1){ requestAnimationFrame(draw); }
      else{
        // 3) 완성 — 잠깐 유지
        setTimeout(function(){
          // 4) 순간 지우기
          line.style.opacity = '0';
          setTimeout(function(){
            line.style.strokeDashoffset = TOTAL;
            // 5) 쉬고 다시 반복
            setTimeout(function(){
              line.style.opacity = '1';
              runLoop();
            }, PAUSE_MS);
          }, 50);
        }, HOLD_MS);
      }
    }
    requestAnimationFrame(draw);
  }

  // 첫 시작은 약간 딜레이
  setTimeout(runLoop, 800);
})();

window.onTodayDateChange=function(val){
  todaySelectedDate=val||null;
  renderToday();
};
